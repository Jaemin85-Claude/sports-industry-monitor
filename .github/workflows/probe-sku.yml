name: probe-sku

# 임시 시험(병합하지 않음) — 해외 정가 3차 상품 늘리기(대표 2026-11-21 지금 추가 수집 — 버버리·톰브라운·클락스·써코니): 브랜드마다 따로(동시) 사이트맵 대조·정가 읽기
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths:
      - probe_sku.py
      - plans/*.json
      - .github/workflows/probe-sku.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plan: [bbr4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        run: python probe_sku.py plans/${{ matrix.plan }}.json
