name: extract-segments

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매주 월요일 01:47 KST = 일요일 16:47 UTC (매일 대시보드 빌드보다 먼저)
    - cron: "47 16 * * 0"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)
    inputs:
      only:
        description: "검증용: 이 티커만 새로 추출해 로그로 확인(쉼표 구분, 예: NKE,CROX,DECK) — 저장 안 함. 비우면 전체 실행"
        required: false
        default: ""

permissions:
  contents: write

concurrency:   # v2026-11-06 개편 P0: 같은 워크플로우가 겹치면 뒤 실행은 앞 실행이 끝날 때까지 대기(같은 파일 커밋 충돌 방지 · 브랜치 실행은 따로 ·
               # 저장 안 하는 진단 실행(only)은 따로 — 기다리던 정기 실행을 밀어내지 않게)
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.only && '-diag' || '' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Extract segments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEG_ONLY: ${{ inputs.only }}
        run: python extract_segments.py
      - name: Commit segments
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/segments.json
          git commit -m "update segments $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do   # v2026-11-06 개편 P0: 푸시가 밀렸거나(다른 워크플로우가 막 푸시) main을 못 받았으면 3번까지 · 같은 파일 충돌은 바로 멈춤
            if git pull --rebase origin main; then
              if git push; then break; fi; why="푸시 밀림"
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true; echo "::error::main과 같은 파일이 충돌 — 커밋 못 함"; exit 1
            else why="main 받기 실패"; fi
            if [ "$i" = 3 ]; then echo "::error::$why — 3번 모두 실패"; exit 1; fi
            echo "$why $i번째 — $((i*10))초 뒤 다시"; sleep $((i*10))
          done
      - name: Check partial failures
        # v2026-10: 수집 스크립트가 '이전 값 유지' 같은 심각한 부분 실패를 soft_fail.txt에 남기면, 저장·커밋은 마친 뒤
        # 여기서 빨간 X로 끝내 12:23 점검이 알림을 보내게 함
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi
