name: update-dart

on:
  schedule:
    # 매월 15일 07:00 KST = 14일 22:00 UTC (3~4월 감사보고서 시즌 이후 자동 반영)
    - cron: "0 22 14 * *"
  workflow_dispatch:   # 수동 실행 버튼
    inputs:
      only:
        description: "검증용: 이 법인 id만(쉼표 구분, 예: trexi,skechers_kr) — 저장·커밋 안 함. 비우면 전체 실행"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch DART domestic financials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          DART_ONLY: ${{ inputs.only }}
        run: python dart_fetch.py
      - name: Commit domestic data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/kr_domestic.json docs/kr_listed_fin.json
          git commit -m "update dart domestic $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
