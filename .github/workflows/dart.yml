name: update-dart

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매월 15일 03:47 KST = 14일 18:47 UTC (3~4월 감사보고서 시즌 이후 자동 반영, 대시보드 04:17보다 먼저)
    - cron: "47 18 14 * *"
  workflow_dispatch:   # 수동 실행 버튼
    inputs:
      only:
        description: "검증용: 이 법인 id만(쉼표 구분, 예: trexi,skechers_kr) — 저장·커밋 안 함. 비우면 전체 실행"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # v3.5 재추출(FIN_V 올림) 첫 실행은 25분+ · v3.7 60→90분(시간 예산 Claude 70분·DART 75분 — 최악에도 약 80분 안에 저장·커밋)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch DART domestic financials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          DART_ONLY: ${{ inputs.only }}
        run: python dart_fetch.py
      - name: Commit domestic data
        if: ${{ !cancelled() }}   # v3.7 스크립트가 저장 뒤 다른 곳에서 실패해도 저장분은 커밋(검증 모드는 파일을 안 써 'no changes')
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/kr_domestic.json docs/kr_listed_fin.json
          git commit -m "update dart domestic $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: Check partial failures
        # v2026-10: 수집 스크립트가 '이전 값 유지' 같은 심각한 부분 실패를 soft_fail.txt에 남기면, 저장·커밋은 마친 뒤
        # 여기서 빨간 X로 끝내 12:23 점검이 알림을 보내게 함
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi
