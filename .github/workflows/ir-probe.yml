name: ir-probe

on:
  workflow_dispatch:   # 수동 실행 전용 (1회용 검증)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Probe adidas / PUMA IR
        env:
          PYTHONUNBUFFERED: "1"
        run: python ir_probe.py
