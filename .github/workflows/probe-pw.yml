name: probe-pw

# 임시 시험(병합하지 않음) — 작업 브랜치에 이 파일·probe_pw.py를 올리면 1회 실행
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths:
      - probe_pw.py
      - .github/workflows/probe-pw.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        run: python probe_pw.py
