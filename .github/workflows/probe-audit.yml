name: probe-audit
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths: [probe_audit.py, .github/workflows/probe-audit.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: git fetch -q origin main && git checkout origin/main -- docs/prices.json
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python probe_audit.py
