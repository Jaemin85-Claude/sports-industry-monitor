name: probe-prices

# 임시 시험(병합하지 않음) — 작업 브랜치에서 price_fetch.py를 1회 돌려 로그로 확인(저장·커밋 안 함)
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths:
      - price_fetch.py
      - .github/workflows/probe-prices.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Price fetch (force)
        env:
          PRICE_FORCE: "1"
          PYTHONUNBUFFERED: "1"
        run: python price_fetch.py && python -c "import json; d=json.load(open('docs/prices.json')); [print(it['id'], {cc:(o.get('p'), o.get('cur'), o.get('sale')) for cc,o in it['m'].items()}) for it in d['items']]"
      - name: Soft fail lines
        if: always()
        run: cat soft_fail.txt 2>/dev/null || echo "실패 표시 없음"
