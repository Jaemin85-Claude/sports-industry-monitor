name: probe-prices

# 임시 시험(병합하지 않음) — 나이키 api.nike.com robots.txt 응답 확인(저장·커밋 안 함)
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths:
      - .github/workflows/probe-prices.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Robots probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import time, requests, price_fetch as pf
          H = pf.HDR
          def show(u, n=400):
              try:
                  r = requests.get(u, headers=H, timeout=20, allow_redirects=True)
                  hd = {k: v for k, v in r.headers.items() if k.lower() in ("content-type", "server", "via", "x-cache", "retry-after", "cache-control", "content-length")}
                  print(f"== {u}\n   status {r.status_code} · final {r.url} · {hd}\n   body: {r.text[:n]!r}")
                  return r
              except Exception as e:
                  print(f"== {u}\n   {type(e).__name__}: {e}")
          for i in range(3):
              show("https://api.nike.com/robots.txt"); time.sleep(5)
          show("https://api.nike.com/no-such-path-xyz")
          show("https://api.nike.com/")
          show(pf.NIKE_FEED.format(m="US", l="en", s="CW2288-111"), 200)
          r = show("https://www.nike.com/robots.txt", 300)
          if r is not None and r.status_code == 200:
              lines = r.text.splitlines(); print("   lines:", len(lines))
              for l in lines:
                  if any(k in l.lower() for k in ("user-agent", "product_feed", "api", "disallow: /$", "disallow: / ")) or l.strip().lower() == "disallow: /":
                      print("   |", l)
          for h in ("https://kr.puma.com", "https://www.on.com", "https://www.salomon.com", "https://www.drmartens.com", "https://www.drmartens.co.kr", "https://salomon.co.kr"):
              try:
                  r = requests.get(h + "/robots.txt", headers=H, timeout=20)
                  print(f"== {h}/robots.txt status {r.status_code} · len {len(r.text)}")
              except Exception as e:
                  print(f"== {h}/robots.txt {type(e).__name__}")
          PY
