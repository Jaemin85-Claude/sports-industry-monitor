name: update-ir

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매주 일 02:47 KST = 토 17:47 UTC
    - cron: "47 17 * * 6"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Fetch adidas / PUMA IR segments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python ir_fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/segments_ir.json
          git commit -m "update ir segments $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
