name: update-ir

on:
  schedule:
    # 매주 일 06:00 KST = 토 21:00 UTC (SEC 추출 05:00 KST 뒤)
    - cron: "0 21 * * 6"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Fetch adidas / PUMA IR segments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python ir_fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/segments_ir.json
          git commit -m "update ir segments $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
