name: update-kosis

on:
  schedule:
    # 매월 5일 06:00 KST = 매월 4일 21:00 UTC (월간 통계 발표 이후)
    - cron: "0 21 4 * *"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch KOSIS indicators
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python kosis_fetch.py
      - name: Commit kosis data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/kosis.json
          git commit -m "update kosis $(date -u +%F)" || echo "no changes"
          git push
