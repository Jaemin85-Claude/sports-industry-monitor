name: probe-b2
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths: [probe_b2.py, .github/workflows/probe-b2.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python probe_b2.py
