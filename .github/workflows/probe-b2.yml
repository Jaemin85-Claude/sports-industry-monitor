name: probe-b2
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths: [probe_b2.py, probe_b2_render.js, .github/workflows/probe-b2.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python probe_b2.py
      - run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/pw playwright-core@1.63.0 > /tmp/pw.log 2>&1 || { cat /tmp/pw.log; exit 1; }
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          PW_MOD=/tmp/pw/node_modules/playwright-core node probe_b2_render.js || true
