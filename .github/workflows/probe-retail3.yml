name: probe-retail3
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths: [probe_retail3.py, .github/workflows/probe-retail3.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python probe_retail3.py
