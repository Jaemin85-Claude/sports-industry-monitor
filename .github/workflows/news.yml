name: update-news

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매일 03:17 KST = 전일 18:17 UTC (04:17 대시보드 빌드보다 먼저)
    - cron: "17 18 * * *"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect and curate news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python news_monitor.py
      - name: Commit news
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/news.json
          git commit -m "update news $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: Check partial failures
        # v2026-10: 수집 스크립트가 '이전 값 유지' 같은 심각한 부분 실패를 soft_fail.txt에 남기면, 저장·커밋은 마친 뒤
        # 여기서 빨간 X로 끝내 12:23 점검이 알림을 보내게 함
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi
