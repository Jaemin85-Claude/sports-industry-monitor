name: update-news

on:
  schedule:
    # 매일 06:30 KST = 전일 21:30 UTC (07:30 대시보드 빌드보다 먼저)
    - cron: "30 21 * * *"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect and curate news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python news_monitor.py
      - name: Commit news
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/news.json
          git commit -m "update news $(date -u +%F)" || echo "no changes"
          git push
