name: update-news

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매일 03:17 KST = 전일 18:17 UTC (04:17 대시보드 빌드보다 먼저)
    - cron: "17 18 * * *"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)
    inputs:
      probe:
        description: "원문 날짜 진단만 — 매체 이름·기사 id 쉼표 구분(예: 패션포스트,fpost.co.kr). Claude 안 씀·저장 안 함"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch history for news archive
        # v2.12 지난 뉴스 1년 보관(docs/news_archive.json)이 없거나 복구가 덜 끝났으면 git 전체 기록을 받아
        # news_monitor가 news.json 지난 버전(8/31~)에서 되살림 — 보통 첫 실행 1회, 그 뒤엔 건너뜀
        run: |
          if python -c 'import json,sys; d=json.load(open("docs/news_archive.json",encoding="utf-8")); sys.exit(0 if (d.get("backfill") or {}).get("done") else 1)' 2>/dev/null; then
            echo "뉴스 보관 파일 있음 — git 기록 받기 건너뜀"
          else
            git fetch --quiet --unshallow origin || echo "::warning::git 기록 받기 실패 — 보관 파일 복구는 다음 실행에서 다시"
          fi
      - name: Collect and curate news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROBE: ${{ inputs.probe }}
        run: |
          # v2.13 수동 실행 입력 probe가 있으면 원문 날짜 진단만(news_monitor.py --probe) — 로그 확인용
          if [ -n "$PROBE" ]; then python news_monitor.py --probe "$PROBE"; else python news_monitor.py; fi
      - name: Commit news
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          if [ -n "$PROBE" ]; then echo "원문 날짜 진단 실행 — 저장 안 함"; exit 0; fi
          # v2.12 작업 브랜치 실행은 저장하지 않음 — git 전체 기록을 받은 브랜치 실행이 데이터 커밋을 브랜치(PR)에 올리지 않게(로그 확인용)
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "브랜치 실행 — 커밋·푸시 안 함(데이터는 main 실행에서만 저장)"; exit 1; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/news.json
          if [ -f docs/news_archive.json ]; then git add docs/news_archive.json; fi
          git commit -m "update news $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: Check partial failures
        # v2026-10: 수집 스크립트가 '이전 값 유지' 같은 심각한 부분 실패를 soft_fail.txt에 남기면, 저장·커밋은 마친 뒤
        # 여기서 빨간 X로 끝내 12:23 점검이 알림을 보내게 함
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi
