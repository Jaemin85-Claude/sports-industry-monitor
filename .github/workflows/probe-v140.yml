name: probe-v140
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths: [.github/workflows/probe-v140.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: SKU stage with public test codes (29CM, 2nd)
        env:
          ERP_SKU_TEST: '[{"brand":"THE NORTH FACE","code":"NS85S31B","status":"selling"},{"brand":"THE NORTH FACE","code":"NS86S32A","status":"selling"},{"brand":"THE NORTH FACE","code":"NS86S72J","status":"selling"},{"brand":"NEW BALANCE","code":"U740BM2","status":"selling"},{"brand":"NEW BALANCE","code":"SD2205GR","status":"selling"},{"brand":"NEW BALANCE","code":"SD2205BR","status":"selling"},{"brand":"ADIDAS","code":"IH3990","status":"selling"},{"brand":"ADIDAS","code":"JS4997","status":"selling"},{"brand":"ADIDAS","code":"HP5054","status":"selling"},{"brand":"VANS","code":"VN000D3HY281","status":"selling"},{"brand":"VANS","code":"VN000BVZ0E01","status":"selling"},{"brand":"VANS","code":"VN000D7YEMT1","status":"selling"}]'
        run: |
          python price_fetch.py > out.txt 2>&1 || true
          grep -E "SKU (뉴발란스|아디다스|반스|노스페이스)|SKU 정가:|Traceback|Error" out.txt | head -40
          python - <<'PY'
          import json
          d = json.load(open("docs/prices.json"))
          for it in d["items"]:
              if it.get("kind") == "sku" and it["brand"] in ("뉴발란스", "아디다스", "반스", "노스페이스"):
                  o = it["m"].get("KR") or {}
                  print(it["id"], "|", it.get("name"), "|", it.get("cat"), "|", o.get("p"), o.get("sp"), o.get("src"), o.get("shop"), o.get("url"))
          PY
