name: probe-erp

# 임시 시험(병합하지 않음 · PR 전에 지움) — ERP 판매·예정 상품(Secrets ERP_SKU_URL·ERP_SKU_TOKEN)을 공식몰에서 몇 %나 찾는지(나라별).
# 공개 저장소라 실행 기록이 공개 — ERP 품번·상품명·주소·토큰은 찍지 않음(비율·구간만 · probe_erp.py). 커밋 메시지에 skip ci가 있으면 안 돎.
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths:
      - .github/workflows/probe-erp.yml
      - probe_erp.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe ERP coverage (aggregates only)
        env:
          ERP_SKU_URL: ${{ secrets.ERP_SKU_URL }}
          ERP_SKU_TOKEN: ${{ secrets.ERP_SKU_TOKEN }}
        run: python probe_erp.py
