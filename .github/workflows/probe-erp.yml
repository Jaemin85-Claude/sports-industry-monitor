name: probe-erp

# 임시 시험(병합하지 않음 · PR 전에 지움) — price_fetch v1.29 SKU 단계 읽는 법(공개 품번 시험 목록) + ERP 목록 읽힘(받음/못 받음만).
# 공개 저장소라 실행 기록이 공개 — ERP 품번·상품명·주소·토큰은 찍지 않음. 커밋 메시지에 skip ci가 있으면 안 돎.
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths:
      - .github/workflows/probe-erp.yml
      - probe_erp.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: SKU stage self-test (public codes)
        run: python probe_erp.py
      - name: ERP list read (received or not only)
        env:
          ERP_SKU_URL: ${{ secrets.ERP_SKU_URL }}
          ERP_SKU_TOKEN: ${{ secrets.ERP_SKU_TOKEN }}
        run: |
          python - <<'PY'
          import price_fetch as pf
          l, t, w = pf.sku_list()
          print("목록:", "받음" if l is not None else "못 받음", w or "")
          PY
