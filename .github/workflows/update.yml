name: update-dashboard

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매일 04:17 KST = 전일 19:17 UTC (뉴스 03:17 뒤)
    - cron: "17 19 * * *"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)
    inputs:
      test_block:
        description: "시험용(브랜치에서만) — 공공데이터포털이 막힌 서버로 가정할 차례(예: 1 · 1,2 · 1,2,3). 비우면 보통 실행"
        required: false
        default: ""
      price_force:
        description: "해외 정가 바로 받기(1) — 7일이 안 지나도 지금 받음(수집 코드를 고친 뒤 확인용). 비우면 주 1회대로"
        required: false
        default: ""
      price_lanes:
        description: "해외 정가 동시 묶음 수(price_fetch v1.12) — 비우면 6, 1이면 예전처럼 차례대로"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 34   # v2026-10-21 물류(12분 제한) + 해외 정가(v2026-10-23 15분 제한)가 함께 길어져도 'Commit dashboard'까지 가게
    outputs:
      retry_keys: ${{ steps.logi.outputs.retry_keys }}   # v2026-10-20 연결 오류로 못 받은 공공데이터포털 자료 → 아래 dgk-retry가 새 서버에서
      conn_tries: ${{ steps.logi.outputs.conn_tries }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: python fetch_data.py
      - name: Naver search trend
        id: naver
        continue-on-error: true   # 네이버 수집이 실패해도 대시보드 갱신은 계속
        env:
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: python naver_trend.py
      - name: Note Naver failure
        if: steps.naver.outcome == 'failure'
        run: |
          echo "naver_trend: 네이버 검색 관심도 수집 실패(이전 값 유지)" >> soft_fail.txt
      - name: Logistics data
        # v2026-10-16 물류(logistics_fetch v1): 관세청 운송비용·KCCI·IMF PortWatch·정시율 → docs/logistics.json (더보기 › 물류)
        # v2026-10-17 logistics_fetch v1.2: 공공데이터포털 오픈 API(관세청 국가별 입·출항 물동량 · 해수부 선박입출항) — 인증키 DATA_GO_KR_API_KEY
        id: logi
        continue-on-error: true   # 물류 수집이 멈춰도 대시보드 갱신은 계속
        timeout-minutes: 12       # 스크립트가 8분에 스스로 멈춤 — 그래도 안 끝나면 여기서 끊음(작업 전체 34분 제한 보호)
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOGI_ATTEMPT: "1"          # v2026-10-20 logistics_fetch v1.3: 1차(다시 받기 2번이 뒤에 있음 — 그 자료의 경고는 마지막 차례에서 셈)
          LOGI_ATTEMPTS: "3"
          LOGI_TEST_BLOCK: ${{ github.ref_name != 'main' && inputs.test_block || '' }}
        run: python logistics_fetch.py
      - name: Note logistics failure
        if: steps.logi.outcome == 'failure'
        run: |
          echo "logistics_fetch: 물류 자료 수집 실패(이전 값 유지)" >> soft_fail.txt
      - name: Overseas list prices
        # v2026-10-21 해외 정가(price_fetch v1): 브랜드 대표 상품 나라별 정가(할인 전) → docs/prices.json (브랜드 상세 하단) · 매일 돌며 7일마다 받음
        id: price
        continue-on-error: true   # 해외 정가가 멈춰도 대시보드 갱신은 계속
        timeout-minutes: 15       # 스크립트가 13분에 스스로 멈춤(v2026-10-23 상품 75개 · 값 299개 — 주 1회만 오래 걸림) · v2026-10-28 묶음 동시 받기(v1.12)로 전체 받기 약 2~3분, 묶음이 걸려도 14분에 저장
        env:
          PYTHONUNBUFFERED: "1"
          PRICE_FORCE: ${{ inputs.price_force }}   # 수동 실행 입력 price_force=1이면 7일이 안 지나도 받음
          PRICE_LANES: ${{ inputs.price_lanes }}   # 수동 실행 입력 — 비우면 묶음 6개 동시, 1이면 예전처럼 차례대로
        run: python price_fetch.py
      - name: Note price failure
        if: steps.price.outcome == 'failure'
        run: |
          echo "price_fetch: 해외 정가 수집 실패(이전 값 유지)" >> soft_fail.txt
      - name: Append history snapshot
        run: python history_append.py
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update dashboard $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: Check partial failures
        # v2026-10: 수집 스크립트가 '이전 값 유지' 같은 심각한 부분 실패를 soft_fail.txt에 남기면, 저장·커밋은 마친 뒤
        # 여기서 빨간 X로 끝내 12:23 점검이 알림을 보내게 함
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi

  dgk-retry-1:
    # v2026-10-20 (대표 지시 '보완안 1') 공공데이터포털(국가정보자원관리원)이 일부 GitHub 서버(IP)에서만 연결이 안 됨 — 같은 서버에서
    # 다시 해도 소용없어, 앞 작업이 연결 오류로 못 받은 공공데이터포털 자료만 새 서버에서 다시 받고 화면을 다시 만듦(2/3)
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.retry_keys != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      retry_keys: ${{ steps.logi.outputs.retry_keys }}
      conn_tries: ${{ steps.logi.outputs.conn_tries }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # 앞 작업이 커밋한 최신 main(기본값은 실행을 시작한 때의 커밋이라 커밋이 부딪힘)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Logistics data (retry 2/3)
        id: logi
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOGI_ATTEMPT: "2"
          LOGI_ATTEMPTS: "3"
          LOGI_RETRY_KEYS: ${{ needs.run.outputs.retry_keys }}
          LOGI_PREV_TRIES: ${{ needs.run.outputs.conn_tries }}
          LOGI_TEST_BLOCK: ${{ github.ref_name != 'main' && inputs.test_block || '' }}
        run: python logistics_fetch.py
      - name: Note logistics failure
        if: steps.logi.outcome == 'failure'
        run: |
          echo "logistics_fetch: 물류 자료 다시 받기(2/3) 실패(이전 값 유지)" >> soft_fail.txt
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update logistics retry 2 $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: Check partial failures
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi

  dgk-retry-2:
    # v2026-10-20 (대표 지시 '보완안 1') 공공데이터포털(국가정보자원관리원)이 일부 GitHub 서버(IP)에서만 연결이 안 됨 — 같은 서버에서
    # 다시 해도 소용없어, 앞 작업이 연결 오류로 못 받은 공공데이터포털 자료만 새 서버에서 다시 받고 화면을 다시 만듦(3/3)
    needs: dgk-retry-1
    if: ${{ !cancelled() && needs.dgk-retry-1.outputs.retry_keys != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      retry_keys: ${{ steps.logi.outputs.retry_keys }}
      conn_tries: ${{ steps.logi.outputs.conn_tries }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # 앞 작업이 커밋한 최신 main(기본값은 실행을 시작한 때의 커밋이라 커밋이 부딪힘)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Logistics data (retry 3/3)
        id: logi
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOGI_ATTEMPT: "3"
          LOGI_ATTEMPTS: "3"
          LOGI_RETRY_KEYS: ${{ needs.dgk-retry-1.outputs.retry_keys }}
          LOGI_PREV_TRIES: ${{ needs.dgk-retry-1.outputs.conn_tries }}
          LOGI_TEST_BLOCK: ${{ github.ref_name != 'main' && inputs.test_block || '' }}
        run: python logistics_fetch.py
      - name: Note logistics failure
        if: steps.logi.outcome == 'failure'
        run: |
          echo "logistics_fetch: 물류 자료 다시 받기(3/3) 실패(이전 값 유지)" >> soft_fail.txt
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update logistics retry 3 $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: Check partial failures
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi
