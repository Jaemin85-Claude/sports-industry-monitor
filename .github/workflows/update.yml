name: update-dashboard

on:
  schedule:
    # 2026-10 대표 승인: GitHub 대기열 지연(3~4시간)이 길어져 모든 예약을 약 3시간 앞당김(순서 유지, 정각·30분 피함)
    # 매일 04:17 KST = 전일 19:17 UTC (뉴스 03:17 뒤)
    - cron: "17 19 * * *"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)
    inputs:
      test_block:
        description: "시험용(브랜치에서만) — 공공데이터포털이 막힌 서버로 가정할 차례(예: 1 · 1,2 · 1,2,3). 비우면 보통 실행"
        required: false
        default: ""
      price_force:
        description: "해외 정가 바로 받기(1) — 7일이 안 지나도 지금 받음(수집 코드를 고친 뒤 확인용). 비우면 주 1회대로"
        required: false
        default: ""
      price_lanes:
        description: "해외 정가 동시 묶음 수(price_fetch v1.12) — 비우면 6, 1이면 예전처럼 차례대로"
        required: false
        default: ""

permissions:
  contents: write

concurrency:   # v2026-11-06 개편 P0: 같은 워크플로우가 겹치면 뒤 실행은 앞 실행이 끝날 때까지 대기(같은 파일 커밋 충돌 방지 · 브랜치 실행은 따로)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 34   # v2026-10-21 물류(12분 제한) + 해외 정가(v2026-10-23 15분 제한)가 함께 길어져도 'Commit dashboard'까지 가게
    outputs:
      retry_keys: ${{ steps.logi.outputs.retry_keys }}   # v2026-10-20 연결 오류로 못 받은 공공데이터포털 자료 → 아래 dgk-retry가 새 서버에서
      conn_tries: ${{ steps.logi.outputs.conn_tries }}
      soft_fail: ${{ steps.sf.outputs.lines }}   # v2026-11-07 개편 P2: 이 작업의 실패 표시 줄 → 다시 받기 작업이 화면을 다시 만들 때 '조치 필요'에 함께
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: python fetch_data.py
      - name: Naver search trend
        id: naver
        continue-on-error: true   # 네이버 수집이 실패해도 대시보드 갱신은 계속
        env:
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: python naver_trend.py
      - name: Note Naver failure
        if: steps.naver.outcome == 'failure'
        run: |
          echo "naver_trend: 네이버 검색 관심도 수집 실패(이전 값 유지)" >> soft_fail.txt
      - name: Logistics data
        # v2026-10-16 물류(logistics_fetch v1): 관세청 운송비용·KCCI·IMF PortWatch·정시율 → docs/logistics.json (더보기 › 물류)
        # v2026-10-17 logistics_fetch v1.2: 공공데이터포털 오픈 API(관세청 국가별 입·출항 물동량 · 해수부 선박입출항) — 인증키 DATA_GO_KR_API_KEY
        id: logi
        continue-on-error: true   # 물류 수집이 멈춰도 대시보드 갱신은 계속
        timeout-minutes: 12       # 스크립트가 8분에 스스로 멈춤 — 그래도 안 끝나면 여기서 끊음(작업 전체 34분 제한 보호)
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOGI_ATTEMPT: "1"          # v2026-10-20 logistics_fetch v1.3: 1차(다시 받기 2번이 뒤에 있음 — 그 자료의 경고는 마지막 차례에서 셈)
          LOGI_ATTEMPTS: "3"
          LOGI_TEST_BLOCK: ${{ github.ref_name != 'main' && inputs.test_block || '' }}
        run: python logistics_fetch.py
      - name: Note logistics failure
        if: steps.logi.outcome == 'failure'
        run: |
          echo "logistics_fetch: 물류 자료 수집 실패(이전 값 유지)" >> soft_fail.txt
      - name: Overseas list prices
        # v2026-10-21 해외 정가(price_fetch v1): 브랜드 대표 상품 나라별 정가(할인 전) → docs/prices.json (브랜드 상세 하단) · 매일 돌며 7일마다 받음
        id: price
        continue-on-error: true   # 해외 정가가 멈춰도 대시보드 갱신은 계속
        timeout-minutes: 15       # 스크립트가 13분에 스스로 멈춤(v2026-10-23 상품 75개 · 값 299개 — 주 1회만 오래 걸림) · v2026-10-28 묶음 동시 받기(v1.12)로 전체 받기 약 2~3분, 묶음이 걸려도 14분에 저장
        env:
          PYTHONUNBUFFERED: "1"
          PRICE_FORCE: ${{ inputs.price_force }}   # 수동 실행 입력 price_force=1이면 7일이 안 지나도 받음
          PRICE_LANES: ${{ inputs.price_lanes }}   # 수동 실행 입력 — 비우면 묶음 6개 동시, 1이면 예전처럼 차례대로
        run: python price_fetch.py
      - name: Note price failure
        if: steps.price.outcome == 'failure'
        run: |
          echo "price_fetch: 해외 정가 수집 실패(이전 값 유지)" >> soft_fail.txt
      - name: Append history snapshot
        run: python history_append.py
      - name: Build dashboard
        run: python build_dashboard.py   # v2026-11-07 개편 P2(build_dashboard v33.31): ./soft_fail.txt 줄 → 화면 머리 '조치 필요 n' · 수집 상태 맨 위 칸
      - name: Check pages in a phone-size browser
        # v2026-11-20 개편 B(대표 결정 2026-11-19 '추천대로'): 매일 만든 화면도 휴대폰 크기 브라우저로 자동 점검 — check.yml의 같은 이름 단계 스크립트를
        # 그대로 읽어 돌림(점검 주소 목록은 check.yml 한 곳 · 그 단계 이름을 바꾸면 여기도). 실패해도 화면·자료는 그대로 저장하고 아래 줄로 빨간 X
        id: smoke
        continue-on-error: true
        timeout-minutes: 8
        run: |
          pip install -q pyyaml
          python - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open(".github/workflows/check.yml", encoding="utf-8"))
          st = [s for s in d["jobs"]["check"]["steps"] if s.get("name") == "Check pages in a phone-size browser"]
          if not st or not st[0].get("run"):
              print("::error::check.yml에서 'Check pages in a phone-size browser' 단계를 못 찾음 — 단계 이름 확인"); sys.exit(1)
          open("/tmp/smoke_step.sh", "w", encoding="utf-8").write(st[0]["run"])
          PY
          bash -e /tmp/smoke_step.sh
      - name: Note page check failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "화면 자동 점검: 오늘 만든 화면에서 오류 — 로그 '화면 점검' 줄 확인(화면·자료는 그대로 저장함)" >> soft_fail.txt
      - name: Pass alert lines on
        # v2026-11-07 개편 P2: soft_fail.txt(실패 표시 줄)를 다음 작업에 넘김 — 다시 받기 작업은 새 서버(빈 폴더)라 앞 작업 줄이 없음
        id: sf
        if: ${{ !cancelled() }}
        run: |
          { echo 'lines<<SF_EOF_p2'; if [ -s soft_fail.txt ]; then cat soft_fail.txt; echo; fi; echo 'SF_EOF_p2'; } >> "$GITHUB_OUTPUT"
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update dashboard $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do   # v2026-11-06 개편 P0: 푸시가 밀렸거나(다른 워크플로우가 막 푸시) main을 못 받았으면 3번까지 · 같은 파일 충돌은 바로 멈춤
            if git pull --rebase origin main; then
              if git push; then break; fi; why="푸시 밀림"
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true; echo "::error::main과 같은 파일이 충돌 — 커밋 못 함"; exit 1
            else why="main 받기 실패"; fi
            if [ "$i" = 3 ]; then echo "::error::$why — 3번 모두 실패"; exit 1; fi
            echo "$why $i번째 — $((i*10))초 뒤 다시"; sleep $((i*10))
          done
      - name: Check partial failures
        # v2026-10: 수집 스크립트가 '이전 값 유지' 같은 심각한 부분 실패를 soft_fail.txt에 남기면, 저장·커밋은 마친 뒤
        # 여기서 빨간 X로 끝내 12:23 점검이 알림을 보내게 함
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi

  dgk-retry-1:
    # v2026-10-20 (대표 지시 '보완안 1') 공공데이터포털(국가정보자원관리원)이 일부 GitHub 서버(IP)에서만 연결이 안 됨 — 같은 서버에서
    # 다시 해도 소용없어, 앞 작업이 연결 오류로 못 받은 공공데이터포털 자료만 새 서버에서 다시 받고 화면을 다시 만듦(2/3)
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.retry_keys != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      retry_keys: ${{ steps.logi.outputs.retry_keys }}
      conn_tries: ${{ steps.logi.outputs.conn_tries }}
      soft_fail: ${{ steps.sf.outputs.lines }}   # v2026-11-07 개편 P2: 1차 + 이 작업의 실패 표시 줄 → 3/3 작업 화면 '조치 필요'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # 앞 작업이 커밋한 최신 main(기본값은 실행을 시작한 때의 커밋이라 커밋이 부딪힘)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Logistics data (retry 2/3)
        id: logi
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOGI_ATTEMPT: "2"
          LOGI_ATTEMPTS: "3"
          LOGI_RETRY_KEYS: ${{ needs.run.outputs.retry_keys }}
          LOGI_PREV_TRIES: ${{ needs.run.outputs.conn_tries }}
          LOGI_TEST_BLOCK: ${{ github.ref_name != 'main' && inputs.test_block || '' }}
        run: python logistics_fetch.py
      - name: Note logistics failure
        if: steps.logi.outcome == 'failure'
        run: |
          echo "logistics_fetch: 물류 자료 다시 받기(2/3) 실패(이전 값 유지)" >> soft_fail.txt
      - name: Build dashboard
        env:
          SOFT_FAIL_PREV: ${{ needs.run.outputs.soft_fail }}   # 앞 작업(1차)의 실패 표시 줄 — 화면 '조치 필요'에 함께(이 작업의 빨간 X 판단에는 안 넣음)
        run: python build_dashboard.py
      - name: Pass alert lines on
        id: sf
        if: ${{ !cancelled() }}
        env:
          SOFT_FAIL_PREV: ${{ needs.run.outputs.soft_fail }}
        run: |
          { echo 'lines<<SF_EOF_p2'; printf '%s\n' "$SOFT_FAIL_PREV"; if [ -s soft_fail.txt ]; then cat soft_fail.txt; echo; fi; echo 'SF_EOF_p2'; } >> "$GITHUB_OUTPUT"
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update logistics retry 2 $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do   # v2026-11-06 개편 P0: 푸시가 밀렸거나(다른 워크플로우가 막 푸시) main을 못 받았으면 3번까지 · 같은 파일 충돌은 바로 멈춤
            if git pull --rebase origin main; then
              if git push; then break; fi; why="푸시 밀림"
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true; echo "::error::main과 같은 파일이 충돌 — 커밋 못 함"; exit 1
            else why="main 받기 실패"; fi
            if [ "$i" = 3 ]; then echo "::error::$why — 3번 모두 실패"; exit 1; fi
            echo "$why $i번째 — $((i*10))초 뒤 다시"; sleep $((i*10))
          done
      - name: Check partial failures
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi

  dgk-retry-2:
    # v2026-10-20 (대표 지시 '보완안 1') 공공데이터포털(국가정보자원관리원)이 일부 GitHub 서버(IP)에서만 연결이 안 됨 — 같은 서버에서
    # 다시 해도 소용없어, 앞 작업이 연결 오류로 못 받은 공공데이터포털 자료만 새 서버에서 다시 받고 화면을 다시 만듦(3/3)
    needs: dgk-retry-1
    if: ${{ !cancelled() && needs.dgk-retry-1.outputs.retry_keys != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      retry_keys: ${{ steps.logi.outputs.retry_keys }}
      conn_tries: ${{ steps.logi.outputs.conn_tries }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # 앞 작업이 커밋한 최신 main(기본값은 실행을 시작한 때의 커밋이라 커밋이 부딪힘)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Logistics data (retry 3/3)
        id: logi
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          LOGI_ATTEMPT: "3"
          LOGI_ATTEMPTS: "3"
          LOGI_RETRY_KEYS: ${{ needs.dgk-retry-1.outputs.retry_keys }}
          LOGI_PREV_TRIES: ${{ needs.dgk-retry-1.outputs.conn_tries }}
          LOGI_TEST_BLOCK: ${{ github.ref_name != 'main' && inputs.test_block || '' }}
        run: python logistics_fetch.py
      - name: Note logistics failure
        if: steps.logi.outcome == 'failure'
        run: |
          echo "logistics_fetch: 물류 자료 다시 받기(3/3) 실패(이전 값 유지)" >> soft_fail.txt
      - name: Build dashboard
        env:
          SOFT_FAIL_PREV: ${{ needs.dgk-retry-1.outputs.soft_fail }}   # 1차 + 2/3 작업의 실패 표시 줄 — 화면 '조치 필요'에 함께(이 작업의 빨간 X 판단에는 안 넣음)
        run: python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update logistics retry 3 $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do   # v2026-11-06 개편 P0: 푸시가 밀렸거나(다른 워크플로우가 막 푸시) main을 못 받았으면 3번까지 · 같은 파일 충돌은 바로 멈춤
            if git pull --rebase origin main; then
              if git push; then break; fi; why="푸시 밀림"
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true; echo "::error::main과 같은 파일이 충돌 — 커밋 못 함"; exit 1
            else why="main 받기 실패"; fi
            if [ "$i" = 3 ]; then echo "::error::$why — 3번 모두 실패"; exit 1; fi
            echo "$why $i번째 — $((i*10))초 뒤 다시"; sleep $((i*10))
          done
      - name: Check partial failures
        run: |
          if [ -s soft_fail.txt ]; then
            while IFS= read -r l; do echo "::error::$l"; done < soft_fail.txt
            echo "부분 실패 $(wc -l < soft_fail.txt)건 — 데이터는 이전 값으로 저장함"
            exit 1
          fi

  summary:
    # v2026-11-20 개편 B(대표 결정 2026-11-19 '추천대로'): 실행 끝 '점검 요약'(30줄 안) — 13:23 점검 루틴이 이 작업 로그 끝(50줄)만 읽음.
    #   앞 작업(run · 다시 받기 2개)이 다 끝난 뒤 그 작업들의 로그를 GitHub API로 읽어 빨간 X 사유 · [WARN]·'실패 —' 줄 · 단계별 걸린 시간 ·
    #   화면 점검 · 수집 결과 · 환율 알림을 모음(같은 줄은 한 번) · 저장·커밋 없음 · 요약을 못 만들어도 이 작업은 성공으로 끝남(실행 결과는 앞 작업대로)
    needs: [run, dgk-retry-1, dgk-retry-2]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, re, subprocess, time
          R, RID, ATT = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"], os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          REF = os.environ.get("GITHUB_REF_NAME", "")
          KST = datetime.timezone(datetime.timedelta(hours=9))
          MAX, W = 30, 220   # 요약 전체 줄 수 · 한 줄 글자 수

          def gh(path, raw=False):
              args = ["gh", "api", path] + (["-H", "Accept: application/vnd.github.raw"] if raw else [])
              for _ in range(3):   # 막 끝난 작업의 로그가 늦게 올라올 때가 있어 8초 쉬고 3번까지
                  p = subprocess.run(args, capture_output=True, text=True)
                  if p.returncode == 0:
                      return p.stdout
                  time.sleep(8)
              return None

          def dur(a, b):
              try:
                  s = int((datetime.datetime.fromisoformat(b.replace("Z", "+00:00")) - datetime.datetime.fromisoformat(a.replace("Z", "+00:00"))).total_seconds())
                  return f"{max(s, 0) // 60}:{max(s, 0) % 60:02d}"
              except Exception:
                  return "?"

          cut = lambda s: s if len(s) <= W else s[:W - 1] + "…"
          JN = {"run": "갱신", "dgk-retry-1": "다시 받기 2/3", "dgk-retry-2": "다시 받기 3/3"}
          ST = {"Fetch data": "수집", "Naver search trend": "네이버", "Logistics data": "물류", "Overseas list prices": "해외 정가",
                "Append history snapshot": "히스토리", "Build dashboard": "화면", "Check pages in a phone-size browser": "화면 점검", "Commit dashboard": "커밋"}
          PY_LBL = {"fetch_data.py": "수집", "naver_trend.py": "네이버", "logistics_fetch.py": "물류", "price_fetch.py": "해외 정가",
                    "history_append.py": "히스토리", "build_dashboard.py": "화면"}
          CONC = {"success": "성공", "failure": "빨간 X", "skipped": "건너뜀", "cancelled": "취소", "timed_out": "시간 초과"}
          TSP = re.compile(r"^﻿?\d{4}-\d\d-\d\dT[\d:.]+Z ?")
          BAD = re.compile(r"\[WARN\]|실패 —|실패 표시|Traceback|FATAL|^ERROR\b|\b\w+Error: ")
          SKIP = re.compile(r"Process completed with exit code|478560\.KS")   # 알려진 정상(블랙야크 .KS → .KQ 재시도)
          INFO = [re.compile(p) for p in (r"^\s*수집 결과", r"^해외 정가: ", r"PortWatch 다시 받기:", r"^판정 기록 \d",
                                          r"^화면 점검 (통과|실패)", r"^\s*오늘 글자:")]
          prio = lambda t: (0 if re.search(r"Traceback|FATAL|\b\w+Error: |^ERROR\b", t) else 1 if "[WARN]" in t
                            else 3 if t.startswith("경고: ") else 2)   # 오류 원문 → [WARN] → '실패 —' 줄 → 경고(가로 넘침 등)
          L = [f"=== 점검 요약 · update-dashboard · {datetime.datetime.now(KST):%Y-%m-%d %H:%M} KST · {REF} · 실행 {RID} ==="]
          try:
              jobs = [j for j in json.loads(gh(f"repos/{R}/actions/runs/{RID}/attempts/{ATT}/jobs?per_page=50") or '{"jobs": []}').get("jobs", [])
                      if j.get("name") in JN]
              jobs.sort(key=lambda j: list(JN).index(j["name"]))
              L.append("결과: " + " · ".join(f"{JN[j['name']]} {CONC.get(j.get('conclusion'), j.get('conclusion') or j.get('status'))}"
                                            + ("" if j.get("conclusion") == "skipped" else f" {dur(j.get('started_at') or '', j.get('completed_at') or '')}")
                                            for j in jobs))
              run = next((j for j in jobs if j["name"] == "run"), None)
              if run:
                  st = [f"{ST[s['name']]} {dur(s.get('started_at') or '', s.get('completed_at') or '')}" + ("(실패)" if s.get("conclusion") == "failure" else "")
                        for s in run.get("steps", []) if s.get("name") in ST and s.get("conclusion") != "skipped"]
                  L.append("단계(분:초): " + " · ".join(st))
              red, warn, info, seen, nolog = [], [], [], set(), []
              for j in jobs:
                  if j.get("conclusion") == "skipped":
                      continue
                  txt = gh(f"repos/{R}/actions/jobs/{j['id']}/logs")
                  if txt is None:
                      nolog.append(JN[j["name"]]); continue
                  cur = ""
                  for raw in txt.splitlines():
                      if "\x1b[36;1m" in raw:   # 단계 스크립트 본문을 보여 주는 줄(실제 출력 아님)
                          continue
                      ln = re.sub(r"\x1b\[[0-9;]*m", "", TSP.sub("", raw)).rstrip()
                      m = re.match(r"^##\[group\]Run python3? (\S+\.py)", ln)
                      if m:
                          cur = PY_LBL.get(m.group(1), "")
                      if not ln.strip() or ln.startswith("##[group]") or ln.startswith("##[endgroup]") or SKIP.search(ln):
                          continue
                      pre = "" if j["name"] == "run" else f"[{JN[j['name']]}] "
                      if ln.startswith("##[error]"):
                          t = ln[9:].strip()
                          if t not in seen:
                              seen.add(t); red.append(pre + t)
                      elif ln.startswith("##[warning]") or BAD.search(ln):
                          t = ln.replace("##[warning]", "경고: ").strip()
                          if t not in seen:
                              seen.add(t); warn.append((pre, t))
                      elif any(p.search(ln) for p in INFO):
                          info.append(pre + (f"{cur}: " if cur and ln.lstrip().startswith("수집 결과") else "") + ln.strip())
              # 빨간 X 사유에 이미 있는 줄은 뺌 · 숫자만 다른 줄(관세청 파일 1·2·3 …)은 한 줄로 묶어 '같은 꼴 n줄' · 오류 원문부터
              grp = {}
              for p, t in warn:
                  if any(t in r or r.split("] ", 1)[-1] in t for r in red):
                      continue
                  k = (p, re.sub(r"\d[\d,.:%-]*", "#", t))
                  if k in grp:
                      grp[k][2] += 1
                  else:
                      grp[k] = [p, t, 1]
              warn = [p + t + (f" (같은 꼴 {n}줄)" if n > 1 else "") for p, t, n in sorted(grp.values(), key=lambda g: prio(g[1]))]
              fx = "환율 알림: 확인 못 함"
              try:
                  d = json.loads(gh(f"repos/{R}/contents/docs/data.json?ref={REF}", raw=True) or "{}")
                  p = d.get("fx_push") or {}
                  first = (p.get("text") or "").splitlines()[0] if p.get("text") else ""
                  fx = f"data.json {str(d.get('generated_at') or '?')[:16]} · 환율 알림 " + (f"{p.get('date')} — {first}" if p.get("date") else "없음")
              except Exception as e:
                  fx += f"({type(e).__name__})"
              info = info[-8:]
              room = MAX - len(L) - len(info) - 2 - (1 if nolog else 0)   # 2 = 환율 줄 + 끝 줄
              body = []
              if red:
                  body.append(f"빨간 X 사유 {len(red)}줄:"); body += [" - " + r for r in red]
              if warn:
                  body.append(f"경고·실패 줄 {len(warn)}개(같은 줄은 한 번):"); body += [" - " + w for w in warn]
              if not red and not warn:
                  body.append("빨간 X 사유·경고·실패 줄 없음")
              if len(body) > room:
                  more = len(body) - (room - 1)
                  body = body[:room - 1] + [f" … 외 {more}줄 — 이 실행의 작업 로그에서 '[WARN]'·'실패' 검색"]
              L += body + info + [fx]
              if nolog:
                  L.append("로그를 못 받은 작업: " + " · ".join(nolog) + " — 단계 결과만 봄")
          except Exception as e:
              L.append(f"점검 요약 실패: {type(e).__name__}: {str(e)[:150]} — 예전처럼 실패 단계 로그를 볼 것")
          L.append("=== 점검 요약 끝 ===")
          out = "\n".join(cut(x) for x in L)
          print(out)
          try:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("```\n" + out + "\n```\n")
          except Exception:
              pass
          PY
