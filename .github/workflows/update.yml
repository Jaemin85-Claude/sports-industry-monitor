name: update-dashboard

on:
  schedule:
    # 매일 07:30 KST = 전일 22:30 UTC
    - cron: "30 22 * * *"
  workflow_dispatch:   # 수동 실행 버튼 (테스트용)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: python fetch_data.py
      - name: Naver search trend
        continue-on-error: true   # 네이버 수집이 실패해도 대시보드 갱신은 계속
        env:
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: python naver_trend.py
      - name: Append history snapshot
        run: python history_append.py
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "update dashboard $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
