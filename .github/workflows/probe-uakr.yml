name: probe-uakr
on:
  push:
    branches: [claude/sports-industry-monitor-update-j2wty5]
    paths: [probe_uakr.py, .github/workflows/probe-uakr.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python probe_uakr.py
