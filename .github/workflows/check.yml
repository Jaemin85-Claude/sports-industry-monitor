name: check-files

# 코드·워크플로우가 바뀔 때 CLAUDE.md의 표(운영 구조·파일 식별표)를 기준으로 검사한다.
#  ① 파이썬 3번째 줄 식별 문구 ② 문법 ③ 워크플로우 이름·실행 대상 파일 ④ docs/*.json 파싱
#  (2026-10 추가) ⑤ 워크플로우 YAML 읽기·예약(cron) 형식 ⑥ 패키지 설치 후 모든 스크립트 불러오기
#  ⑦ 화면 실제로 만들어 보기(build_dashboard) + 화면 뼈대 표식(id) + 화면 스크립트 문법 검사(node --check)
#     표식(2026-10 A안 v33): 오늘 todayCard·statusWarn · 브랜드 brandBody · 시장 mkChips·newsBody·kpis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.py"
      - "CLAUDE.md"
      - ".github/workflows/*.yml"
      - "docs/worldmap.json"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe logistics data formats (temporary branch test)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install -q requests
          python - <<'PY'
          import html as H, io, json, re, time
          import requests

          UA = {"User-Agent": "Mozilla/5.0 (sports-industry-monitor data-source probe)"}
          S = requests.Session()
          S.headers.update(UA)


          def get(url, **kw):
              t = time.time()
              try:
                  r = S.get(url, timeout=kw.pop("timeout", 30), **kw)
                  return r, time.time() - t, None
              except Exception as e:
                  return None, time.time() - t, f"{type(e).__name__}: {str(e)[:150]}"


          def clean(s):
              return re.sub(r"\s+", " ", H.unescape(re.sub(r"<[^>]+>", " ", s or ""))).strip()


          def cells(body, n=160):
              body = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", body)
              out = []
              for tb in re.findall(r"(?is)<table.*?</table>", body):
                  rows = []
                  for tr in re.findall(r"(?is)<tr.*?</tr>", tb):
                      cs = [clean(c) for c in re.findall(r"(?is)<t[hd][^>]*>(.*?)</t[hd]>", tr)]
                      if cs:
                          rows.append(" | ".join(cs))
                  out.append(rows)
              return out


          def show_tables(name, body, maxrows=40):
              tbs = cells(body)
              print(f"   표 {len(tbs)}개")
              for i, rows in enumerate(tbs[:4]):
                  print(f"   [표 {i}] 행 {len(rows)}")
                  for r in rows[:maxrows]:
                      print(f"      {r[:220]}")


          def links(body, pat, n=20):
              found = []
              for m in re.finditer(r"""(?is)(href|onclick|action|src)\s*=\s*["']([^"']*)["']""", body):
                  v = H.unescape(m.group(2))
                  if re.search(pat, v, re.I) and v not in found:
                      found.append(v)
              return found[:n]


          def page(name, url, tables=True, pat=None, maxrows=40, **kw):
              r, sec, err = get(url, **kw)
              if err:
                  print(f"[{name}] 실패 {err}")
                  return None
              print(f"[{name}] HTTP {r.status_code} · {r.headers.get('content-type', '')[:40]} · {len(r.content):,}B · {sec:.1f}s · {r.url[:140]}")
              body = r.text
              if tables:
                  show_tables(name, body, maxrows)
              if pat:
                  print(f"   링크({pat}):", links(body, pat))
              return r


          print("== ① KCCI (해진공) ==")
          r = page("KCCI 표", "https://www.kobc.or.kr/ebz/shippinginfo/kcci/gridList.do?mId=0304000000", pat=r"excel|xls|down|timeseries|chart|list\.do", maxrows=30)
          if r is not None:
              b = r.text
              for kw in ("기준일", "발표일", "Composite", "종합", "KCCI", "KUWI", "KMEI", "중동", "Middle"):
                  i = b.find(kw)
                  print(f"   '{kw}':", clean(b[max(0, i - 120):i + 220])[:300] if i >= 0 else "없음")
              forms = re.findall(r"(?is)<form[^>]*>", b)[:5]
              print("   form:", [clean(f) or f[:160] for f in forms])
              js = re.findall(r"(?is)function\s+(\w*(?:excel|Excel|down|Down|search|Search)\w*)\s*\([^)]*\)\s*\{(.{0,300})", b)[:5]
              for nm, body in js:
                  print(f"   JS {nm}: {clean(body)[:280]}")
          page("KCCI 영문", "https://www.kobc.or.kr/ebz/shippinginfoeng/kcci/gridList.do?mId=0302000000", maxrows=20)
          page("KCCI 시계열", "https://www.kobc.or.kr/ebz/shippinginfo/timeseries/gridList.do?mId=0304000000", pat=r"excel|xls|down", maxrows=25)

          print("== ② 공공데이터포털 파일 ==")
          for ds in ("15131881", "15116806"):
              r = page(f"data.go.kr {ds}", f"https://www.data.go.kr/data/{ds}/fileData.do", tables=False, pat=r"fileDownload|Down|download|atchFile|uddi")
              if r is None:
                  continue
              b = r.text
              cand = re.findall(r"(?is)(fn_fileDataDown|fileDetailDown|fn_fileDown|downloadFile)\s*\(([^)]*)\)", b)[:6]
              print("   다운로드 함수:", cand)
              ids = sorted(set(re.findall(r"FILE_\d{12,}", b)))[:5]
              uddi = sorted(set(re.findall(r"uddi:[0-9a-f-]{36}", b)))[:5]
              print("   atchFileId:", ids, "· uddi:", uddi)
              tries = []
              for fid in ids[:2]:
                  tries.append(f"https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId={fid}&fileDetailSn=1&insertDataPrcus=N")
              for u in tries:
                  rr, sec, err = get(u, timeout=40)
                  if err:
                      print("   내려받기 실패", err)
                      continue
                  raw = rr.content
                  print(f"   내려받기 HTTP {rr.status_code} · {rr.headers.get('content-type', '')[:40]} · {len(raw):,}B · disp={rr.headers.get('content-disposition', '')[:90]}")
                  for enc in ("utf-8-sig", "cp949"):
                      try:
                          txt = raw[:1500].decode(enc)
                          print(f"   ({enc}) 앞부분:", txt[:600].replace("\n", " ⏎ "))
                          break
                      except Exception:
                          continue

          print("== ③ 공공데이터포털 검색(관세청 운송비용) ==")
          for q in ("운송비용", "항공수입 운송비용", "해상수출입 운송비용", "컨테이너선운임지수"):
              r, sec, err = get("https://www.data.go.kr/tcs/dss/selectDataSetList.do", params={"keyword": q})
              if err:
                  print(f"[{q}] 실패 {err}")
                  continue
              b = r.text
              hits = []
              for m in re.finditer(r'(?is)href="(/data/(\d+)/(fileData|openapi|standard)\.do)"[^>]*>(.*?)</a>', b):
                  t = clean(m.group(4))
                  if t and (m.group(2), t) not in hits:
                      hits.append((m.group(2), m.group(3), t[:70]))
              print(f"[{q}] HTTP {r.status_code} · {len(hits)}건")
              for h in hits[:12]:
                  print("    ", h)

          print("== ④ 국가물류통합정보센터 ==")
          r = page("NLIC 항공수입 운송비용", "https://www.nlic.go.kr/nlic/flightImportTrnsCt.action", pat=r"TrnsCt|trnsCt|운송비용|excel", maxrows=30, timeout=40)
          for g in ("seaImportTrnsCt", "seaExportTrnsCt", "shipImportTrnsCt", "seaTrnsCt", "cntnrImportTrnsCt"):
              rr, sec, err = get(f"https://www.nlic.go.kr/nlic/{g}.action", timeout=30)
              print(f"   {g}: {'실패 ' + err if err else f'HTTP {rr.status_code} · {len(rr.content):,}B · 표 {len(cells(rr.text))}개'}")

          print("== ⑤ 관세청 수출입무역통계 운임 메뉴 ==")
          r, sec, err = get("https://tradedata.go.kr/")
          if not err:
              b = r.text
              for kw in ("해상컨테이너운임", "항공운송비용", "수출입운임통계"):
                  for m in list(re.finditer(kw, b))[:2]:
                      print(f"   '{kw}':", b[max(0, m.start() - 300):m.start() + 120].replace("\n", " ")[:420])
              print("   메뉴 링크:", links(b, r"ETS|ets|frght|Frght|Fare|fare|운임")[:15])

          print("== ⑥ Sea-Intelligence 정시율 ==")
          r, sec, err = get("https://www.sea-intelligence.com/press-room")
          if err:
              print("실패", err)
          else:
              b = r.text
              arts = []
              for m in re.finditer(r'(?is)<a[^>]+href="([^"]*press-room/\d+[^"]*)"[^>]*>(.*?)</a>', b):
                  t = clean(m.group(2))
                  if t and (m.group(1), t) not in arts:
                      arts.append((m.group(1), t))
              print(f"   기사 {len(arts)}건")
              for u, t in arts[:16]:
                  print("    ", t[:90], "→", u[:110])
              glp = [a for a in arts if re.search(r"reliab|GLP|liner performance", a[1], re.I)]
              for u, t in glp[:2]:
                  url = u if u.startswith("http") else "https://www.sea-intelligence.com" + u
                  rr, sec, err = get(url)
                  if err:
                      print("   기사 실패", err)
                      continue
                  txt = clean(re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", rr.text))
                  print(f"   [{t[:60]}] {len(txt):,}자")
                  k = 0
                  for s in re.split(r"(?<=[.!?])\s+", txt):
                      if re.search(r"\d+(\.\d+)?\s*%|\d+\.\d+\s*days", s) and len(s) < 400:
                          print("      ·", s[:300])
                          k += 1
                          if k >= 14:
                              break
          print("== 끝 ==")
          PY
      - name: Check files against CLAUDE.md
        run: |
          python - <<'PY'
          import glob, json, os, re, sys

          errs = []
          md = open("CLAUDE.md", encoding="utf-8").read()

          def section(title):
              m = re.search(r"^## " + re.escape(title) + r"[^\n]*\n(.*?)(?=^## |\Z)", md, re.M | re.S)
              return m.group(1) if m else ""

          def rows(text):
              for line in text.splitlines():
                  if line.startswith("|") and not re.match(r"^\|\s*-", line):
                      yield [c.strip() for c in line.strip().strip("|").split("|")]

          # ① 파일 식별표: 파일명 → 3번째 줄 문구
          ident = {}
          for c in rows(section("파일 식별표")):
              m = re.search(r"`([^`]+)`", c[1]) if len(c) > 1 else None
              if c[0].endswith(".py") and m:
                  ident[c[0]] = m.group(1)
          if len(ident) < 8:
              errs.append(f"CLAUDE.md 파일 식별표에서 파이썬 파일을 {len(ident)}개만 읽음 — 표 형식 확인")

          for f, phrase in ident.items():
              if not os.path.exists(f):
                  errs.append(f"{f}: 식별표에 있으나 파일 없음")
                  continue
              lines = open(f, encoding="utf-8").read().splitlines()
              l3 = lines[2] if len(lines) > 2 else ""
              if phrase not in l3:
                  errs.append(f"{f}: 3번째 줄에 '{phrase}' 없음 — 실제: {l3.strip()[:80]}")

          pys = sorted(glob.glob("*.py"))
          for f in pys:
              if f not in ident:
                  errs.append(f"{f}: 식별표에 없는 파일 — CLAUDE.md 파일 식별표에 등록 필요")
              try:
                  compile(open(f, encoding="utf-8").read(), f, "exec")
              except SyntaxError as e:
                  errs.append(f"{f}: 문법 오류 {e.lineno}번째 줄 — {e.msg}")

          # ② 운영 구조표: 워크플로우 파일 → name
          wf = {}
          for c in rows(section("운영 구조")):
              m = re.fullmatch(r"`([^`]+\.yml)`", c[0])
              if m and len(c) > 1:
                  wf[m.group(1)] = c[1]
          if len(wf) < 6:
              errs.append(f"CLAUDE.md 운영 구조표에서 워크플로우를 {len(wf)}개만 읽음 — 표 형식 확인")

          ymls = sorted(glob.glob(".github/workflows/*.yml"))
          for path in ymls:
              f = os.path.basename(path)
              txt = open(path, encoding="utf-8").read()
              m = re.search(r"^name:\s*(.+?)\s*$", txt, re.M)
              name = m.group(1).strip("\"'") if m else None
              if f not in wf:
                  errs.append(f"{f}: 운영 구조표에 없는 워크플로우 — CLAUDE.md 등록 또는 파일 삭제")
              elif name != wf[f]:
                  errs.append(f"{f}: 첫 name '{name}' ≠ 운영 구조표 '{wf[f]}'")
              for s in re.findall(r"python3?\s+([\w./-]+\.py)", txt):
                  if not os.path.exists(s):
                      errs.append(f"{f}: 실행 대상 {s} 없음")
          for f in wf:
              if not os.path.exists(f".github/workflows/{f}"):
                  errs.append(f"{f}: 운영 구조표에 있으나 파일 없음")

          # ③ docs/*.json 파싱 (+ worldmap 최상위 키)
          jsons = sorted(glob.glob("docs/*.json"))
          for path in jsons:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{path}: JSON 파싱 실패 — {str(e)[:120]}")
                  continue
              if path.endswith("worldmap.json") and not all(k in d for k in ("viewBox", "europe")):
                  errs.append(f"{path}: 최상위 키 viewBox·europe 없음")

          if errs:
              for e in errs:
                  print(f"::error::{e}")
              print(f"검사 실패 {len(errs)}건")
              sys.exit(1)
          print(f"검사 통과: 파이썬 {len(pys)}개 · 워크플로우 {len(ymls)}개 · JSON {len(jsons)}개")
          PY
      - name: Install packages
        run: pip install -r requirements.txt pypdf pyyaml
      - name: Check workflow YAML and script imports
        run: |
          python - <<'PY'
          import glob, importlib, os, re, sys
          import yaml
          errs = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              f = os.path.basename(path)
              try:
                  d = yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: YAML 읽기 실패 — {str(e)[:160]}")
                  continue
              on = d.get("on", d.get(True)) or {}   # YAML 1.1은 on: 을 True로 읽음
              if not isinstance(d.get("jobs"), dict) or not d["jobs"]:
                  errs.append(f"{f}: jobs 없음")
              if f == "check.yml":
                  continue
              sch = on.get("schedule") if isinstance(on, dict) else None
              if not sch:
                  errs.append(f"{f}: 예약(schedule) 없음 — 자동 실행이 안 됨")
              for s in sch or []:
                  c = str((s or {}).get("cron", ""))
                  if len(c.split()) != 5 or not re.fullmatch(r"[\d*/,\- ]+", c):
                      errs.append(f"{f}: cron 형식 오류 '{c}'")
              if not isinstance(on, dict) or "workflow_dispatch" not in on:
                  errs.append(f"{f}: 수동 실행(workflow_dispatch) 없음")
          sys.path.insert(0, ".")
          for p in sorted(glob.glob("*.py")):
              m = p[:-3]
              try:
                  importlib.import_module(m)   # 모든 스크립트는 __main__ 가드 → 불러오기만, 실행 안 함
              except Exception as e:
                  errs.append(f"{p}: 불러오기 실패 — {type(e).__name__}: {str(e)[:160]}")
          if errs:
              for e in errs:
                  print(f"::error::{e}")
              sys.exit(1)
          print("검사 통과: 워크플로우 YAML·예약 형식, 스크립트 불러오기")
          PY
      - name: Build dashboard and check page script
        run: |
          python build_dashboard.py
          python - <<'PY'
          import re, sys
          h = open("docs/index.html", encoding="utf-8").read()
          i, j = h.find("<script>"), h.rfind("</script>")
          if i < 0 or j < i:
              print("::error::index.html에서 <script> 블록을 못 찾음"); sys.exit(1)
          open("/tmp/page.js", "w", encoding="utf-8").write(h[i + 8:j])
          for mark in ('id="todayCard"', 'id="statusWarn"', 'id="brandBody"', 'id="mkChips"', 'id="newsBody"', 'id="kpis"'):
              if mark not in h:
                  print(f"::error::index.html에 {mark} 없음 — 화면 뼈대 확인"); sys.exit(1)
          print(f"index.html {len(h):,}자 · 스크립트 {j - i - 8:,}자")
          PY
          node --check /tmp/page.js && echo "화면 스크립트 문법 통과"
