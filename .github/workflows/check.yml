name: check-files

# 코드·워크플로우가 바뀔 때 CLAUDE.md의 표(운영 구조·파일 식별표)를 기준으로 검사한다.
#  ① 파이썬 3번째 줄 식별 문구 ② 문법 ③ 워크플로우 이름·실행 대상 파일 ④ docs/*.json 파싱
#  (2026-10 추가) ⑤ 워크플로우 YAML 읽기·예약(cron) 형식 ⑥ 패키지 설치 후 모든 스크립트 불러오기
#  ⑦ 화면 실제로 만들어 보기(build_dashboard) + 화면 뼈대 표식(id) + 화면 스크립트 문법 검사(node --check)
#     표식(2026-10 A안 v33): 오늘 todayCard·statusWarn · 브랜드 brandBody · 시장 mkChips·newsBody·kpis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.py"
      - "CLAUDE.md"
      - ".github/workflows/*.yml"
      - "docs/worldmap.json"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check files against CLAUDE.md
        run: |
          python - <<'PY'
          import glob, json, os, re, sys

          errs = []
          md = open("CLAUDE.md", encoding="utf-8").read()

          def section(title):
              m = re.search(r"^## " + re.escape(title) + r"[^\n]*\n(.*?)(?=^## |\Z)", md, re.M | re.S)
              return m.group(1) if m else ""

          def rows(text):
              for line in text.splitlines():
                  if line.startswith("|") and not re.match(r"^\|\s*-", line):
                      yield [c.strip() for c in line.strip().strip("|").split("|")]

          # ① 파일 식별표: 파일명 → 3번째 줄 문구
          ident = {}
          for c in rows(section("파일 식별표")):
              m = re.search(r"`([^`]+)`", c[1]) if len(c) > 1 else None
              if c[0].endswith(".py") and m:
                  ident[c[0]] = m.group(1)
          if len(ident) < 8:
              errs.append(f"CLAUDE.md 파일 식별표에서 파이썬 파일을 {len(ident)}개만 읽음 — 표 형식 확인")

          for f, phrase in ident.items():
              if not os.path.exists(f):
                  errs.append(f"{f}: 식별표에 있으나 파일 없음")
                  continue
              lines = open(f, encoding="utf-8").read().splitlines()
              l3 = lines[2] if len(lines) > 2 else ""
              if phrase not in l3:
                  errs.append(f"{f}: 3번째 줄에 '{phrase}' 없음 — 실제: {l3.strip()[:80]}")

          pys = sorted(glob.glob("*.py"))
          for f in pys:
              if f not in ident:
                  errs.append(f"{f}: 식별표에 없는 파일 — CLAUDE.md 파일 식별표에 등록 필요")
              try:
                  compile(open(f, encoding="utf-8").read(), f, "exec")
              except SyntaxError as e:
                  errs.append(f"{f}: 문법 오류 {e.lineno}번째 줄 — {e.msg}")

          # ② 운영 구조표: 워크플로우 파일 → name
          wf = {}
          for c in rows(section("운영 구조")):
              m = re.fullmatch(r"`([^`]+\.yml)`", c[0])
              if m and len(c) > 1:
                  wf[m.group(1)] = c[1]
          if len(wf) < 6:
              errs.append(f"CLAUDE.md 운영 구조표에서 워크플로우를 {len(wf)}개만 읽음 — 표 형식 확인")

          ymls = sorted(glob.glob(".github/workflows/*.yml"))
          for path in ymls:
              f = os.path.basename(path)
              txt = open(path, encoding="utf-8").read()
              m = re.search(r"^name:\s*(.+?)\s*$", txt, re.M)
              name = m.group(1).strip("\"'") if m else None
              if f not in wf:
                  errs.append(f"{f}: 운영 구조표에 없는 워크플로우 — CLAUDE.md 등록 또는 파일 삭제")
              elif name != wf[f]:
                  errs.append(f"{f}: 첫 name '{name}' ≠ 운영 구조표 '{wf[f]}'")
              for s in re.findall(r"python3?\s+([\w./-]+\.py)", txt):
                  if not os.path.exists(s):
                      errs.append(f"{f}: 실행 대상 {s} 없음")
          for f in wf:
              if not os.path.exists(f".github/workflows/{f}"):
                  errs.append(f"{f}: 운영 구조표에 있으나 파일 없음")

          # ③ docs/*.json 파싱 (+ worldmap 최상위 키)
          jsons = sorted(glob.glob("docs/*.json"))
          for path in jsons:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{path}: JSON 파싱 실패 — {str(e)[:120]}")
                  continue
              if path.endswith("worldmap.json") and not all(k in d for k in ("viewBox", "europe")):
                  errs.append(f"{path}: 최상위 키 viewBox·europe 없음")

          if errs:
              for e in errs:
                  print(f"::error::{e}")
              print(f"검사 실패 {len(errs)}건")
              sys.exit(1)
          print(f"검사 통과: 파이썬 {len(pys)}개 · 워크플로우 {len(ymls)}개 · JSON {len(jsons)}개")
          PY
      - name: Install packages
        run: pip install -r requirements.txt pypdf pyyaml
      - name: Probe tier-2 brands (temporary branch test)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          PYTHONUNBUFFERED: "1"
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, re, time
          import requests
          URL = "https://naverapihub.apigw.ntruss.com/search-trend/v1/search"
          H = {"X-NCP-APIGW-API-KEY-ID": os.environ["NCP_APIGW_API_KEY_ID"], "X-NCP-APIGW-API-KEY": os.environ["NCP_APIGW_API_KEY"], "Content-Type": "application/json"}
          ANCHOR = ("나이키", ["나이키", "nike"])
          # 같은 브랜드의 검색어 후보를 따로따로(어느 표기가 큰지) + 묶음 전체
          C = [
           ("몽클레어", ["몽클레어"]), ("몽클레르", ["몽클레르"]), ("moncler", ["moncler"]), ("몽클 묶음", ["몽클레어", "몽클레르", "moncler", "몽클레어 패딩"]),
           ("스톤아일랜드", ["스톤아일랜드"]), ("스톤 아일랜드", ["스톤 아일랜드"]), ("stone island", ["stone island"]), ("스톤 묶음", ["스톤아일랜드", "스톤 아일랜드", "stone island"]),
           ("톰브라운", ["톰브라운"]), ("톰 브라운", ["톰 브라운"]), ("thom browne", ["thom browne"]), ("톰브 묶음", ["톰브라운", "톰 브라운", "thom browne", "톰브라운 가디건"]),
           ("버버리", ["버버리"]), ("burberry", ["burberry"]), ("버버리 트렌치", ["버버리 트렌치코트", "버버리 트렌치"]), ("버버리 묶음", ["버버리", "burberry", "버버리 트렌치코트"]),
           ("폴로 랄프로렌", ["폴로 랄프로렌", "폴로랄프로렌"]), ("랄프로렌", ["랄프로렌", "랄프 로렌"]), ("ralph lauren", ["ralph lauren", "polo ralph lauren"]), ("폴로", ["폴로"]),
           ("랄프 묶음", ["폴로 랄프로렌", "폴로랄프로렌", "랄프로렌", "랄프 로렌", "ralph lauren", "polo ralph lauren"]),
          ]
          start, end = datetime.date(2023, 10, 1), datetime.date(2026, 9, 30)
          def call(groups):
              body = {"startDate": start.isoformat(), "endDate": end.isoformat(), "timeUnit": "month",
                      "keywordGroups": [{"groupName": g, "keywords": kw[:20]} for g, kw in groups]}
              for a in range(3):
                  r = requests.post(URL, headers=H, json=body, timeout=30)
                  if r.status_code >= 500 and a < 2:
                      time.sleep(3); continue
                  if r.status_code != 200:
                      print("HTTP", r.status_code, r.text[:200]); return {}
                  return {x["title"]: {d["period"][:7]: float(d["ratio"]) for d in x.get("data", [])} for x in r.json().get("results", [])}
              return {}
          months = []
          d = start
          while d <= end:
              months.append(d.strftime("%Y-%m")); d = (d.replace(day=28) + datetime.timedelta(days=4)).replace(day=1)
          mean = lambda xs: sum(xs) / len(xs) if xs else None
          print("== 네이버 검색 규모(나이키 최근 12달 = 100) · 최근 3달 전년 대비 · 최근 12달 전년 대비 ==")
          for i in range(0, len(C), 4):
              batch = C[i:i + 4]
              res = call([ANCHOR] + list(batch))
              a = [res.get(ANCHOR[0], {}).get(m, 0.0) for m in months]
              an12 = mean(a[-12:])
              for nm, kw in batch:
                  s = [res.get(nm, {}).get(m, 0.0) for m in months]
                  sc = mean(s[-12:]) / an12 * 100 if an12 else None
                  y3 = (mean(s[-3:]) / mean(s[-15:-12]) - 1) * 100 if mean(s[-15:-12]) else None
                  y12 = (sum(s[-12:]) / sum(s[-24:-12]) - 1) * 100 if sum(s[-24:-12]) else None
                  f = lambda v: "―" if v is None else round(v, 1)
                  print(f"  {nm:<14} 규모 {f(sc)} · 3달 {f(y3)}% · 12달 {f(y12)}% · 최근6달 {[round(v / an12 * 100, 1) if an12 else None for v in s[-6:]]}")
              time.sleep(0.3)
          PY
      - name: Probe tier-2 HQ financials + IR pages (temporary branch test)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, re, requests
          import fetch_data as fd
          for t, n in (("MONC.MI", "몽클레르"), ("ZGN", "제냐(톰브라운)"), ("BRBY.L", "버버리"), ("RL", "랄프로렌")):
              print(f"== {t} {n} ==")
              try:
                  d = fd.fetch_one(t, n, "글로벌 브랜드")
                  print("  ITEM " + json.dumps({k: d.get(k) for k in ("currency", "fin_currency", "fy", "latest_q_yoy", "q_end", "q_prev_end", "inventory", "inv_yoy", "inv_date", "inv_prev_date", "q_inv", "q_inv_date", "q_inv_prev_date", "q_inv_yoy", "q_inv_rev_yoy", "price", "off_high_pct", "earn_date", "error")}, ensure_ascii=False, default=str)[:1500])
              except Exception as e:
                  print("  예외", type(e).__name__, str(e)[:300])
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"}
          for u in ("https://www.monclergroup.com/en/investors", "https://www.monclergroup.com/en/investors/results-centre",
                    "https://www.monclergroup.com/en/media/press-releases", "https://www.burberryplc.com/investors",
                    "https://www.burberryplc.com/investors/results-reports", "https://www.burberryplc.com/news/corporate"):
              try:
                  r = requests.get(u, headers=UA, timeout=30)
                  html = r.text
                  pdf = sorted(set(re.findall(r'href="([^"]+\.pdf[^"]*)"', html, re.I)))
                  res = [h for h in sorted(set(re.findall(r'href="([^"]+)"', html))) if re.search(r'result|quarter|half|interim|trading|revenue|first|nine|press', h, re.I)]
                  print(f"== {u} HTTP {r.status_code} · {len(html):,}자 · PDF {len(pdf)} · 결과 링크 {len(res)}")
                  for h in pdf[:12]: print("   pdf", h[:180])
                  for h in res[:25]: print("   link", h[:180])
              except Exception as e:
                  print(f"== {u} 오류 {type(e).__name__}: {str(e)[:200]}")
          H = {"User-Agent": "sports-industry-monitor research nightsit7@gmail.com"}
          for t in ("RL", "ZGN"):
              try:
                  cm = requests.get("https://www.sec.gov/files/company_tickers.json", headers=H, timeout=30).json()
                  cik = next((v["cik_str"] for v in cm.values() if v["ticker"] == t), None)
                  sub = requests.get(f"https://data.sec.gov/submissions/CIK{int(cik):010d}.json", headers=H, timeout=30).json()
                  r = sub["filings"]["recent"]
                  rows = [f"{r['form'][i]} {r['filingDate'][i]}" for i in range(min(25, len(r['form']))) if r['form'][i] in ("8-K", "6-K", "10-Q", "10-K", "20-F")]
                  print(f"== EDGAR {t} cik {cik} · {sub.get('name')} · 최근: {', '.join(rows[:14])}")
              except Exception as e:
                  print(f"== EDGAR {t} 오류 {type(e).__name__}: {str(e)[:200]}")
          PY
      - name: Check workflow YAML and script imports
        run: |
          python - <<'PY'
          import glob, importlib, os, re, sys
          import yaml
          errs = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              f = os.path.basename(path)
              try:
                  d = yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: YAML 읽기 실패 — {str(e)[:160]}")
                  continue
              on = d.get("on", d.get(True)) or {}   # YAML 1.1은 on: 을 True로 읽음
              if not isinstance(d.get("jobs"), dict) or not d["jobs"]:
                  errs.append(f"{f}: jobs 없음")
              if f == "check.yml":
                  continue
              sch = on.get("schedule") if isinstance(on, dict) else None
              if not sch:
                  errs.append(f"{f}: 예약(schedule) 없음 — 자동 실행이 안 됨")
              for s in sch or []:
                  c = str((s or {}).get("cron", ""))
                  if len(c.split()) != 5 or not re.fullmatch(r"[\d*/,\- ]+", c):
                      errs.append(f"{f}: cron 형식 오류 '{c}'")
              if not isinstance(on, dict) or "workflow_dispatch" not in on:
                  errs.append(f"{f}: 수동 실행(workflow_dispatch) 없음")
          sys.path.insert(0, ".")
          for p in sorted(glob.glob("*.py")):
              m = p[:-3]
              try:
                  importlib.import_module(m)   # 모든 스크립트는 __main__ 가드 → 불러오기만, 실행 안 함
              except Exception as e:
                  errs.append(f"{p}: 불러오기 실패 — {type(e).__name__}: {str(e)[:160]}")
          if errs:
              for e in errs:
                  print(f"::error::{e}")
              sys.exit(1)
          print("검사 통과: 워크플로우 YAML·예약 형식, 스크립트 불러오기")
          PY
      - name: Build dashboard and check page script
        run: |
          python build_dashboard.py
          python - <<'PY'
          import re, sys
          h = open("docs/index.html", encoding="utf-8").read()
          i, j = h.find("<script>"), h.rfind("</script>")
          if i < 0 or j < i:
              print("::error::index.html에서 <script> 블록을 못 찾음"); sys.exit(1)
          open("/tmp/page.js", "w", encoding="utf-8").write(h[i + 8:j])
          for mark in ('id="todayCard"', 'id="statusWarn"', 'id="brandBody"', 'id="mkChips"', 'id="newsBody"', 'id="kpis"'):
              if mark not in h:
                  print(f"::error::index.html에 {mark} 없음 — 화면 뼈대 확인"); sys.exit(1)
          print(f"index.html {len(h):,}자 · 스크립트 {j - i - 8:,}자")
          PY
          node --check /tmp/page.js && echo "화면 스크립트 문법 통과"
