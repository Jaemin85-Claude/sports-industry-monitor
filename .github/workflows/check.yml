name: check-files

# 코드·워크플로우가 바뀔 때 CLAUDE.md의 표(운영 구조·파일 식별표)를 기준으로 검사한다.
#  ① 파이썬 3번째 줄 식별 문구 ② 문법 ③ 워크플로우 이름·실행 대상 파일 ④ docs/*.json 파싱
#  (2026-10 추가) ⑤ 워크플로우 YAML 읽기·예약(cron) 형식 ⑥ 패키지 설치 후 모든 스크립트 불러오기
#  ⑦ 화면 실제로 만들어 보기(build_dashboard) + 화면 뼈대 표식(id) + 화면 스크립트 문법 검사(node --check)
#     표식(2026-10 A안 v33): 오늘 todayCard·statusWarn · 브랜드 brandBody · 시장 mkChips·newsBody·kpis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.py"
      - "CLAUDE.md"
      - ".github/workflows/*.yml"
      - "docs/worldmap.json"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe logistics data formats (temporary branch test)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install -q requests
          python - <<'PY'
          import html as H, re, time
          import requests

          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0 (sports-industry-monitor data-source probe)"})


          def req(method, url, **kw):
              t = time.time()
              try:
                  r = S.request(method, url, timeout=kw.pop("timeout", 40), **kw)
                  return r, time.time() - t, None
              except Exception as e:
                  return None, time.time() - t, f"{type(e).__name__}: {str(e)[:150]}"


          def clean(s):
              return re.sub(r"\s+", " ", H.unescape(re.sub(r"<[^>]+>", " ", s or ""))).strip()


          def rows_of(body):
              body = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", body)
              out = []
              for tr in re.findall(r"(?is)<tr.*?</tr>", body):
                  cs = [clean(c) for c in re.findall(r"(?is)<t[hd][^>]*>(.*?)</t[hd]>", tr)]
                  if cs:
                      out.append(cs)
              return out


          TS = "https://www.kobc.or.kr/ebz/shippinginfo/timeseries/gridList.do?mId=0304000000"
          print("== ① KCCI 시계열 화면 구조 ==")
          r, sec, err = req("GET", TS)
          if err:
              print("실패", err)
          else:
              b = r.text
              for m in re.finditer(r"(?is)<(input|select)\b[^>]*>", b):
                  tag = m.group(0)
                  nm = re.search(r'name="([^"]*)"', tag)
                  if not nm:
                      continue
                  val = re.search(r'value="([^"]*)"', tag)
                  typ = re.search(r'type="([^"]*)"', tag)
                  extra = ""
                  if m.group(1).lower() == "select":
                      seg = b[m.end():m.end() + 1500]
                      opts = re.findall(r'(?is)<option[^>]*value="([^"]*)"[^>]*>(.*?)</option>', seg.split("</select>")[0])
                      extra = " 옵션 " + str([(v, clean(t)) for v, t in opts][:12])
                  print(f"   {m.group(1)} name={nm.group(1)} type={typ.group(1) if typ else ''} value={val.group(1) if val else ''}{extra}")
              for fn in ("excelDownload", "fn_search", "fnSearch", "goPage", "fn_egov_link_page", "linkPage", "search"):
                  for m in re.finditer(r"(?is)function\s+" + fn + r"\s*\(([^)]*)\)\s*\{(.{0,700})", b):
                      body_s = re.sub(r"\s+", " ", m.group(2))[:650]
                      print(f"   JS {fn}({m.group(1)}): {body_s}")
              pg = re.findall(r"(?is)(?:fn_egov_link_page|linkPage|goPage)\((\d+)\)", b)
              print("   쪽 번호:", sorted(set(int(x) for x in pg))[:20])
              i = b.find("excelDownload")
              print("   excelDownload 주변:", re.sub(r"\s+", " ", b[max(0, i - 200):i + 300])[:500])
              for js in re.findall(r'src="([^"]*\.js)"', b):
                  if "indx" in js or "timeseries" in js or "excel" in js.lower():
                      rr, s2, e2 = req("GET", "https://www.kobc.or.kr" + js if js.startswith("/") else js)
                      if not e2:
                          t = rr.text
                          for m in re.finditer(r"(?is)(excel\w*|Excel\w*)\s*[:=(].{0,300}", t):
                              seg_s = re.sub(r"\s+", " ", m.group(0))[:300]
                              print(f"   [{js}] {seg_s}")
                              break

          print("== ② KCCI 시계열 조건 바꿔 받기 ==")
          tries = [
              ("GET pageIndex=2", "GET", TS + "&pageIndex=2", None),
              ("POST pageIndex=2", "POST", TS, {"pageIndex": "2"}),
              ("POST 기간", "POST", TS, {"searchStartDate": "2022-11-01", "searchEndDate": "2026-10-16", "pageIndex": "1"}),
              ("POST 기간2", "POST", TS, {"startDate": "2022-11-01", "endDate": "2026-10-16", "pageIndex": "1"}),
              ("POST 많이", "POST", TS, {"pageIndex": "1", "recordCountPerPage": "300", "pageUnit": "300"}),
          ]
          for nm, mth, url, data in tries:
              r, sec, err = req(mth, url, data=data)
              if err:
                  print(f"   {nm}: 실패 {err}")
                  continue
              rs = [x for x in rows_of(r.text) if x and re.match(r"\d{4}-\d{2}-\d{2}$", x[0])]
              print(f"   {nm}: HTTP {r.status_code} · 날짜 행 {len(rs)} · {rs[0][0] if rs else ''} ~ {rs[-1][0] if rs else ''}")

          print("== ③ 관세청 파일(열쇠 없이) ==")
          for ds in ("15116806", "15116850", "15116807"):
              r, sec, err = req("GET", f"https://www.data.go.kr/data/{ds}/fileData.do")
              if err:
                  print(f"[{ds}] 실패 {err}")
                  continue
              b = r.text
              title = clean((re.search(r"(?is)<title>(.*?)</title>", b) or [None, ""])[1])
              ids = sorted(set(re.findall(r"FILE_\d{12,}", b)))
              nxt = re.search(r"차기 등록 예정일</strong>\s*<div class=\"value\">([^<]*)<", b)
              mod = re.search(r"수정일</strong>\s*<div class=\"value\">([^<]*)<", b)
              print(f"[{ds}] {title} · atchFileId {ids} · 수정일 {mod.group(1) if mod else '?'} · 차기 {nxt.group(1) if nxt else '?'}")
              if not ids:
                  continue
              rr, sec, err = req("GET", f"https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId={ids[0]}&fileDetailSn=1&insertDataPrcus=N")
              if err:
                  print("   내려받기 실패", err)
                  continue
              raw = rr.content
              txt = None
              for enc in ("utf-8-sig", "cp949"):
                  try:
                      txt = raw.decode(enc)
                      break
                  except Exception:
                      pass
              lines = (txt or "").strip().splitlines()
              print(f"   HTTP {rr.status_code} · {len(raw):,}B · 행 {len(lines)}")
              for l in lines[:2] + ["…"] + lines[-3:]:
                  print("     ", l[:200])

          print("== ④ 공공데이터포털 OpenAPI 설명(중동 포함?) ==")
          for ds in ("15129097", "15129099", "15131881"):
              r, sec, err = req("GET", f"https://www.data.go.kr/data/{ds}/{'fileData' if ds == '15131881' else 'openapi'}.do")
              if err:
                  print(f"[{ds}] 실패 {err}")
                  continue
              b = r.text
              txt = clean(re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", b))
              for kw in ("중동", "요청주소", "서비스URL", "Base URL", "End Point", "상세기능", "설명", "바로가기", "제공기관 홈페이지"):
                  i = txt.find(kw)
                  if i >= 0:
                      print(f"[{ds}] '{kw}': {txt[max(0, i - 80):i + 260]}")
              for u in sorted(set(re.findall(r"https?://(?:apis\.data\.go\.kr|api\.odcloud\.kr)/[\w/.:-]+", b)))[:5]:
                  print(f"[{ds}] API 주소: {u}")

          print("== ⑤ Sea-Intelligence 정시율 기사들 ==")
          r, sec, err = req("GET", "https://www.sea-intelligence.com/press-room")
          if not err:
              arts = []
              for m in re.finditer(r'(?is)<a[^>]+href="([^"]*press-room/(\d+)[^"]*)"[^>]*>(.*?)</a>', r.text):
                  t = clean(m.group(3))
                  if t and t != "Continue reading" and (m.group(1), t) not in arts:
                      arts.append((m.group(1), t))
              glp = [a for a in arts if re.search(r"reliab", a[1], re.I)]
              print(f"   전체 기사 {len(arts)} · 정시율 제목 {len(glp)}")
              for u, t in glp[:14]:
                  print("    ", t[:90], "→", u)
              pg = re.findall(r'href="([^"]*press-room\?start=\d+)"', r.text)
              print("   다음 쪽:", sorted(set(pg))[:5])
              for u, t in glp[1:6]:
                  url = u if u.startswith("http") else "https://www.sea-intelligence.com" + u
                  rr, sec, err = req("GET", url)
                  if err:
                      continue
                  txt = clean(re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", rr.text))
                  d = re.search(r'"datePublished"\s*:\s*"([^"]+)"', rr.text) or re.search(r'dateModified" content="([^"]+)"', rr.text)
                  print(f"   [{t[:70]}] 날짜 {d.group(1) if d else '?'}")
                  k = 0
                  for s in re.split(r"(?<=[.!?])\s+", txt):
                      if re.search(r"schedule reliability|average delay", s, re.I) and re.search(r"\d", s) and len(s) < 420:
                          print("      ·", s[:330])
                          k += 1
                          if k >= 4:
                              break
          print("== 끝 ==")
          PY
      - name: Check files against CLAUDE.md
        run: |
          python - <<'PY'
          import glob, json, os, re, sys

          errs = []
          md = open("CLAUDE.md", encoding="utf-8").read()

          def section(title):
              m = re.search(r"^## " + re.escape(title) + r"[^\n]*\n(.*?)(?=^## |\Z)", md, re.M | re.S)
              return m.group(1) if m else ""

          def rows(text):
              for line in text.splitlines():
                  if line.startswith("|") and not re.match(r"^\|\s*-", line):
                      yield [c.strip() for c in line.strip().strip("|").split("|")]

          # ① 파일 식별표: 파일명 → 3번째 줄 문구
          ident = {}
          for c in rows(section("파일 식별표")):
              m = re.search(r"`([^`]+)`", c[1]) if len(c) > 1 else None
              if c[0].endswith(".py") and m:
                  ident[c[0]] = m.group(1)
          if len(ident) < 8:
              errs.append(f"CLAUDE.md 파일 식별표에서 파이썬 파일을 {len(ident)}개만 읽음 — 표 형식 확인")

          for f, phrase in ident.items():
              if not os.path.exists(f):
                  errs.append(f"{f}: 식별표에 있으나 파일 없음")
                  continue
              lines = open(f, encoding="utf-8").read().splitlines()
              l3 = lines[2] if len(lines) > 2 else ""
              if phrase not in l3:
                  errs.append(f"{f}: 3번째 줄에 '{phrase}' 없음 — 실제: {l3.strip()[:80]}")

          pys = sorted(glob.glob("*.py"))
          for f in pys:
              if f not in ident:
                  errs.append(f"{f}: 식별표에 없는 파일 — CLAUDE.md 파일 식별표에 등록 필요")
              try:
                  compile(open(f, encoding="utf-8").read(), f, "exec")
              except SyntaxError as e:
                  errs.append(f"{f}: 문법 오류 {e.lineno}번째 줄 — {e.msg}")

          # ② 운영 구조표: 워크플로우 파일 → name
          wf = {}
          for c in rows(section("운영 구조")):
              m = re.fullmatch(r"`([^`]+\.yml)`", c[0])
              if m and len(c) > 1:
                  wf[m.group(1)] = c[1]
          if len(wf) < 6:
              errs.append(f"CLAUDE.md 운영 구조표에서 워크플로우를 {len(wf)}개만 읽음 — 표 형식 확인")

          ymls = sorted(glob.glob(".github/workflows/*.yml"))
          for path in ymls:
              f = os.path.basename(path)
              txt = open(path, encoding="utf-8").read()
              m = re.search(r"^name:\s*(.+?)\s*$", txt, re.M)
              name = m.group(1).strip("\"'") if m else None
              if f not in wf:
                  errs.append(f"{f}: 운영 구조표에 없는 워크플로우 — CLAUDE.md 등록 또는 파일 삭제")
              elif name != wf[f]:
                  errs.append(f"{f}: 첫 name '{name}' ≠ 운영 구조표 '{wf[f]}'")
              for s in re.findall(r"python3?\s+([\w./-]+\.py)", txt):
                  if not os.path.exists(s):
                      errs.append(f"{f}: 실행 대상 {s} 없음")
          for f in wf:
              if not os.path.exists(f".github/workflows/{f}"):
                  errs.append(f"{f}: 운영 구조표에 있으나 파일 없음")

          # ③ docs/*.json 파싱 (+ worldmap 최상위 키)
          jsons = sorted(glob.glob("docs/*.json"))
          for path in jsons:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{path}: JSON 파싱 실패 — {str(e)[:120]}")
                  continue
              if path.endswith("worldmap.json") and not all(k in d for k in ("viewBox", "europe")):
                  errs.append(f"{path}: 최상위 키 viewBox·europe 없음")

          if errs:
              for e in errs:
                  print(f"::error::{e}")
              print(f"검사 실패 {len(errs)}건")
              sys.exit(1)
          print(f"검사 통과: 파이썬 {len(pys)}개 · 워크플로우 {len(ymls)}개 · JSON {len(jsons)}개")
          PY
      - name: Install packages
        run: pip install -r requirements.txt pypdf pyyaml
      - name: Check workflow YAML and script imports
        run: |
          python - <<'PY'
          import glob, importlib, os, re, sys
          import yaml
          errs = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              f = os.path.basename(path)
              try:
                  d = yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: YAML 읽기 실패 — {str(e)[:160]}")
                  continue
              on = d.get("on", d.get(True)) or {}   # YAML 1.1은 on: 을 True로 읽음
              if not isinstance(d.get("jobs"), dict) or not d["jobs"]:
                  errs.append(f"{f}: jobs 없음")
              if f == "check.yml":
                  continue
              sch = on.get("schedule") if isinstance(on, dict) else None
              if not sch:
                  errs.append(f"{f}: 예약(schedule) 없음 — 자동 실행이 안 됨")
              for s in sch or []:
                  c = str((s or {}).get("cron", ""))
                  if len(c.split()) != 5 or not re.fullmatch(r"[\d*/,\- ]+", c):
                      errs.append(f"{f}: cron 형식 오류 '{c}'")
              if not isinstance(on, dict) or "workflow_dispatch" not in on:
                  errs.append(f"{f}: 수동 실행(workflow_dispatch) 없음")
          sys.path.insert(0, ".")
          for p in sorted(glob.glob("*.py")):
              m = p[:-3]
              try:
                  importlib.import_module(m)   # 모든 스크립트는 __main__ 가드 → 불러오기만, 실행 안 함
              except Exception as e:
                  errs.append(f"{p}: 불러오기 실패 — {type(e).__name__}: {str(e)[:160]}")
          if errs:
              for e in errs:
                  print(f"::error::{e}")
              sys.exit(1)
          print("검사 통과: 워크플로우 YAML·예약 형식, 스크립트 불러오기")
          PY
      - name: Build dashboard and check page script
        run: |
          python build_dashboard.py
          python - <<'PY'
          import re, sys
          h = open("docs/index.html", encoding="utf-8").read()
          i, j = h.find("<script>"), h.rfind("</script>")
          if i < 0 or j < i:
              print("::error::index.html에서 <script> 블록을 못 찾음"); sys.exit(1)
          open("/tmp/page.js", "w", encoding="utf-8").write(h[i + 8:j])
          for mark in ('id="todayCard"', 'id="statusWarn"', 'id="brandBody"', 'id="mkChips"', 'id="newsBody"', 'id="kpis"'):
              if mark not in h:
                  print(f"::error::index.html에 {mark} 없음 — 화면 뼈대 확인"); sys.exit(1)
          print(f"index.html {len(h):,}자 · 스크립트 {j - i - 8:,}자")
          PY
          node --check /tmp/page.js && echo "화면 스크립트 문법 통과"
