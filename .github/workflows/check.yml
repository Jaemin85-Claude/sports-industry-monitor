name: check-files

# 코드·워크플로우가 바뀔 때 CLAUDE.md의 표(운영 구조·파일 식별표)를 기준으로 검사한다.
#  ① 파이썬 3번째 줄 식별 문구 ② 문법 ③ 워크플로우 이름·실행 대상 파일 ④ docs/*.json 파싱
#  (2026-10 추가) ⑤ 워크플로우 YAML 읽기·예약(cron) 형식 ⑥ 패키지 설치 후 모든 스크립트 불러오기
#  ⑦ 화면 실제로 만들어 보기(build_dashboard) + 화면 뼈대 표식(id) + 화면 스크립트 문법 검사(node --check)
#     표식(2026-10 A안 v33): 오늘 todayCard·statusWarn · 브랜드 brandBody · 시장 mkChips·newsBody·kpis
#  (2026-11-06 개편 P0) ⑧ 화면 자동 점검 — 만든 화면을 휴대폰 크기(390×844) 브라우저로 화면 주소 18곳 열기:
#     스크립트 오류·빈 화면이면 실패 · 가로 넘침·오늘 글자 예산(전체 800·첫 화면 320)은 경고 · 화면 파일 gzip 600KB 넘으면 실패(550KB 경고)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.py"
      - "CLAUDE.md"
      - ".github/workflows/*.yml"
      - "docs/worldmap.json"
      - "docs/our_freight.json"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # v2026-11-06 화면 자동 점검(브라우저) 추가
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check files against CLAUDE.md
        run: |
          python - <<'PY'
          import glob, json, os, re, sys

          errs = []
          md = open("CLAUDE.md", encoding="utf-8").read()

          def section(title):
              m = re.search(r"^## " + re.escape(title) + r"[^\n]*\n(.*?)(?=^## |\Z)", md, re.M | re.S)
              return m.group(1) if m else ""

          def rows(text):
              for line in text.splitlines():
                  if line.startswith("|") and not re.match(r"^\|\s*-", line):
                      yield [c.strip() for c in line.strip().strip("|").split("|")]

          # ① 파일 식별표: 파일명 → 3번째 줄 문구
          ident = {}
          for c in rows(section("파일 식별표")):
              m = re.search(r"`([^`]+)`", c[1]) if len(c) > 1 else None
              if c[0].endswith(".py") and m:
                  ident[c[0]] = m.group(1)
          if len(ident) < 8:
              errs.append(f"CLAUDE.md 파일 식별표에서 파이썬 파일을 {len(ident)}개만 읽음 — 표 형식 확인")

          for f, phrase in ident.items():
              if not os.path.exists(f):
                  errs.append(f"{f}: 식별표에 있으나 파일 없음")
                  continue
              lines = open(f, encoding="utf-8").read().splitlines()
              l3 = lines[2] if len(lines) > 2 else ""
              if phrase not in l3:
                  errs.append(f"{f}: 3번째 줄에 '{phrase}' 없음 — 실제: {l3.strip()[:80]}")

          pys = sorted(glob.glob("*.py"))
          for f in pys:
              if f not in ident:
                  errs.append(f"{f}: 식별표에 없는 파일 — CLAUDE.md 파일 식별표에 등록 필요")
              try:
                  compile(open(f, encoding="utf-8").read(), f, "exec")
              except SyntaxError as e:
                  errs.append(f"{f}: 문법 오류 {e.lineno}번째 줄 — {e.msg}")

          # ② 운영 구조표: 워크플로우 파일 → name
          wf = {}
          for c in rows(section("운영 구조")):
              m = re.fullmatch(r"`([^`]+\.yml)`", c[0])
              if m and len(c) > 1:
                  wf[m.group(1)] = c[1]
          if len(wf) < 6:
              errs.append(f"CLAUDE.md 운영 구조표에서 워크플로우를 {len(wf)}개만 읽음 — 표 형식 확인")

          ymls = sorted(glob.glob(".github/workflows/*.yml"))
          for path in ymls:
              f = os.path.basename(path)
              txt = open(path, encoding="utf-8").read()
              m = re.search(r"^name:\s*(.+?)\s*$", txt, re.M)
              name = m.group(1).strip("\"'") if m else None
              if f not in wf:
                  errs.append(f"{f}: 운영 구조표에 없는 워크플로우 — CLAUDE.md 등록 또는 파일 삭제")
              elif name != wf[f]:
                  errs.append(f"{f}: 첫 name '{name}' ≠ 운영 구조표 '{wf[f]}'")
              for s in re.findall(r"python3?\s+([\w./-]+\.py)", txt):
                  if not os.path.exists(s):
                      errs.append(f"{f}: 실행 대상 {s} 없음")
          for f in wf:
              if not os.path.exists(f".github/workflows/{f}"):
                  errs.append(f"{f}: 운영 구조표에 있으나 파일 없음")

          # ③ docs/*.json 파싱 (+ worldmap 최상위 키)
          jsons = sorted(glob.glob("docs/*.json"))
          for path in jsons:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{path}: JSON 파싱 실패 — {str(e)[:120]}")
                  continue
              if path.endswith("worldmap.json") and not all(k in d for k in ("viewBox", "europe")):
                  errs.append(f"{path}: 최상위 키 viewBox·europe 없음")
              if path.endswith("our_freight.json") and not all(k in d for k in ("air_q", "war")):   # 우리 운임(대표 자료 · 2026-10-28 전부 공개)
                  errs.append(f"{path}: 최상위 키 air_q·war 없음")

          if errs:
              for e in errs:
                  print(f"::error::{e}")
              print(f"검사 실패 {len(errs)}건")
              sys.exit(1)
          print(f"검사 통과: 파이썬 {len(pys)}개 · 워크플로우 {len(ymls)}개 · JSON {len(jsons)}개")
          PY
      - name: Install packages
        run: pip install -r requirements.txt pypdf pyyaml
      - name: Check workflow YAML and script imports
        run: |
          python - <<'PY'
          import glob, importlib, os, re, sys
          import yaml
          errs = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              f = os.path.basename(path)
              try:
                  d = yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: YAML 읽기 실패 — {str(e)[:160]}")
                  continue
              on = d.get("on", d.get(True)) or {}   # YAML 1.1은 on: 을 True로 읽음
              if not isinstance(d.get("jobs"), dict) or not d["jobs"]:
                  errs.append(f"{f}: jobs 없음")
              if f == "check.yml":
                  continue
              sch = on.get("schedule") if isinstance(on, dict) else None
              if not sch:
                  errs.append(f"{f}: 예약(schedule) 없음 — 자동 실행이 안 됨")
              for s in sch or []:
                  c = str((s or {}).get("cron", ""))
                  if len(c.split()) != 5 or not re.fullmatch(r"[\d*/,\- ]+", c):
                      errs.append(f"{f}: cron 형식 오류 '{c}'")
              if not isinstance(on, dict) or "workflow_dispatch" not in on:
                  errs.append(f"{f}: 수동 실행(workflow_dispatch) 없음")
          sys.path.insert(0, ".")
          for p in sorted(glob.glob("*.py")):
              m = p[:-3]
              try:
                  importlib.import_module(m)   # 모든 스크립트는 __main__ 가드 → 불러오기만, 실행 안 함
              except Exception as e:
                  errs.append(f"{p}: 불러오기 실패 — {type(e).__name__}: {str(e)[:160]}")
          if errs:
              for e in errs:
                  print(f"::error::{e}")
              sys.exit(1)
          print("검사 통과: 워크플로우 YAML·예약 형식, 스크립트 불러오기")
          PY
      - name: Build dashboard and check page script
        run: |
          python build_dashboard.py
          python - <<'PY'
          import re, sys
          h = open("docs/index.html", encoding="utf-8").read()
          i, j = h.find("<script>"), h.rfind("</script>")
          if i < 0 or j < i:
              print("::error::index.html에서 <script> 블록을 못 찾음"); sys.exit(1)
          open("/tmp/page.js", "w", encoding="utf-8").write(h[i + 8:j])
          for mark in ('id="todayCard"', 'id="statusWarn"', 'id="brandBody"', 'id="mkChips"', 'id="newsBody"', 'id="kpis"'):
              if mark not in h:
                  print(f"::error::index.html에 {mark} 없음 — 화면 뼈대 확인"); sys.exit(1)
          print(f"index.html {len(h):,}자 · 스크립트 {j - i - 8:,}자")
          PY
          node --check /tmp/page.js && echo "화면 스크립트 문법 통과"
      - name: Check page size
        run: |
          python - <<'PY'
          import gzip, sys
          raw = open("docs/index.html", "rb").read()
          gz = len(gzip.compress(raw, 9))
          print(f"화면 파일 {len(raw)/1024:,.0f}KB · gzip {gz/1024:,.0f}KB (예산 600KB · 경고 550KB)")
          if gz > 600 * 1024:
              print(f"::error::화면 파일 gzip {gz/1024:,.0f}KB — 600KB 넘음(휴대폰 첫 화면이 느려짐 · 큰 자료는 따로 받기)"); sys.exit(1)
          if gz > 550 * 1024:
              print(f"::warning::화면 파일 gzip {gz/1024:,.0f}KB — 550KB 넘음")
          PY
      - name: Check pages in a phone-size browser
        # v2026-11-06 개편 P0: 화면 주소마다 열어 스크립트 오류·빈 화면을 잡음(외부 요청은 막고 파일만 — 네트워크에 흔들리지 않게)
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/pw playwright-core@1.63.0 > /tmp/pw.log 2>&1 || { cat /tmp/pw.log; exit 1; }
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then /tmp/pw/node_modules/.bin/playwright-core install chromium; fi
          cat > /tmp/smoke.js <<'JS'
          // 화면 자동 점검(check-files ⑧ · 2026-11-06 개편 P0) — 빌드한 docs/index.html을 휴대폰 크기로 열어
          // 화면 주소마다 ① 스크립트 오류(pageerror) ② 내용이 그려졌는지 ③ 가로 넘침을 보고, 오늘 화면 글자 수는 경고만.
          // 외부 요청(글꼴·아이콘)은 막고 파일만 읽음 — 결과가 네트워크에 흔들리지 않게.
          const { chromium } = require(process.env.PW_MOD || 'playwright-core');
          const path = require('path');
          const FILE = 'file://' + path.resolve(process.argv[2] || 'docs/index.html');
          const EXE = process.env.CHROME || undefined;
          const errs = [], warns = [];
          const routes = ['', '#/brand', '#/market/news', '#/market/cal', '#/market/sig', '#/market/co', '#/market/kr', '#/market/map',
            '#/more', '#/more/peer', '#/more/fb', '#/more/fx', '#/more/logi', '#/more/price', '#/more/cb', '#/more/status'];
          (async () => {
            const b = await chromium.launch(EXE ? { executablePath: EXE } : {});
            const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 1 });
            await ctx.route('**/*', r => { const u = r.request().url(); (u.startsWith('file:') || u.startsWith('data:')) ? r.continue() : r.abort(); });
            async function visit(hash, label) {
              const p = await ctx.newPage(); const pe = [];
              p.on('pageerror', e => pe.push(String(e && e.message || e).slice(0, 200)));
              const t0 = Date.now();
              try { await p.goto(FILE + hash, { waitUntil: 'load', timeout: 60000 }); await p.waitForTimeout(400); }
              catch (e) { errs.push(`${label}: 열기 실패 — ${String(e.message).slice(0, 160)}`); await p.close(); return null; }
              const m = await p.evaluate(() => {
                const box = document.getElementById('content') || document.body;
                const txt = (box.innerText || '').replace(/\s+/g, '');
                return { len: txt.length, sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth, hash: location.hash };
              });
              pe.forEach(x => errs.push(`${label}: 스크립트 오류 — ${x}`));
              if (m.len < 40) errs.push(`${label}: 화면이 비어 있음(글자 ${m.len})`);
              if (m.sw > m.cw + 1) warns.push(`${label}: 가로 넘침 ${m.sw}px > ${m.cw}px`);
              console.log(`  ${label.padEnd(26)} 글자 ${String(m.len).padStart(6)} · ${Date.now() - t0}ms${pe.length ? ' · 오류 ' + pe.length : ''}`);
              return p;
            }
            // 오늘 — 글자 예산(경고만): 전체 800 · 첫 화면 320(하단 탭 제외, 공백 제외) — 2026-10-19·10-27 대표 지시 '텍스트 최소화'
            const p0 = await visit('', '오늘');
            let extra = [];
            if (p0) {
              const t = await p0.evaluate(() => {
                const box = document.getElementById('content') || document.body, H = innerHeight;
                const nav = document.querySelector('nav.tabs'); const navTop = nav ? nav.getBoundingClientRect().top : H;
                let all = 0, first = 0; const w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
                while (w.nextNode()) {
                  const n = w.currentNode, s = n.textContent.replace(/\s+/g, ''); if (!s) continue;
                  const el = n.parentElement; if (!el || !el.offsetParent && getComputedStyle(el).position !== 'fixed') continue;
                  if (el.closest('details:not([open])') && !el.closest('summary')) continue;
                  all += s.length; const r = el.getBoundingClientRect(); if (r.top < Math.min(H, navTop) && r.bottom > 0) first += s.length;
                }
                let brand = null, tick = null;
                try { const M = chkModel(); brand = (M.main[0] || M.rest[0]).b.name; } catch (e) {}
                try { tick = DATA.items[0].ticker; } catch (e) {}
                return { all, first, brand, tick };
              });
              console.log(`  오늘 글자: 전체 ${t.all} · 첫 화면 ${t.first} (예산 800 · 320)`);
              if (t.all > 800) warns.push(`오늘 글자 ${t.all}자 — 예산 800자 넘음`);
              if (t.first > 320) warns.push(`오늘 첫 화면 글자 ${t.first}자 — 예산 320자 넘음`);
              if (t.brand) extra.push(['#/brand/' + encodeURIComponent(t.brand), '브랜드 상세 ' + t.brand]); else errs.push('오늘: 판정 브랜드를 못 찾음(chkModel)');
              if (t.tick) extra.push(['#/market/co/' + encodeURIComponent(t.tick), '기업 상세 ' + t.tick]); else errs.push('오늘: 기업 목록을 못 찾음(DATA.items)');
              await p0.close();
            }
            for (const r of routes.slice(1)) { const p = await visit(r, r); if (p) await p.close(); }
            for (const [r, l] of extra) { const p = await visit(r, l); if (p) await p.close(); }
            await b.close();
            warns.forEach(w => console.log(`::warning::${w}`));
            errs.forEach(e => console.log(`::error::${e}`));
            console.log(errs.length ? `화면 점검 실패 ${errs.length}건` : `화면 점검 통과: ${routes.length + extra.length}개 화면 · 경고 ${warns.length}건`);
            process.exit(errs.length ? 1 : 0);
          })().catch(e => { console.log(`::error::화면 점검 실행 오류 — ${e.message}`); process.exit(1); });
          JS
          PW_MOD=/tmp/pw/node_modules/playwright-core CHROME="$CHROME" node /tmp/smoke.js docs/index.html
