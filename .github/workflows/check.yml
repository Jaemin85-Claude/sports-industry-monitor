name: check-files

# 코드·워크플로우가 바뀔 때 CLAUDE.md의 표(운영 구조·파일 식별표)를 기준으로 검사한다.
#  ① 파이썬 3번째 줄 식별 문구 ② 문법 ③ 워크플로우 이름·실행 대상 파일 ④ docs/*.json 파싱
#  (2026-10 추가) ⑤ 워크플로우 YAML 읽기·예약(cron) 형식 ⑥ 패키지 설치 후 모든 스크립트 불러오기
#  ⑦ 화면 실제로 만들어 보기(build_dashboard) + 화면 뼈대 표식(id) + 화면 스크립트 문법 검사(node --check)
#     표식(2026-10 A안 v33): 오늘 todayCard·statusWarn · 브랜드 brandBody · 시장 mkChips·newsBody·kpis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.py"
      - "CLAUDE.md"
      - ".github/workflows/*.yml"
      - "docs/worldmap.json"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe data.go.kr APIs (temporary branch test)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          pip install -q requests
          python - <<'PY'
          import datetime, json, os, re, time
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from urllib.parse import quote, quote_plus
          import requests

          T0 = time.time()
          BUDGET = 8 * 60   # 작업 10분 제한 안에서
          KEY = os.environ.get("DATA_GO_KR_API_KEY", "").strip()
          FORMS = sorted({f for f in (KEY, quote(KEY, safe=""), quote_plus(KEY), quote(KEY)) if f}, key=len, reverse=True)
          KST = datetime.timezone(datetime.timedelta(hours=9))
          IN_URL = "https://apis.data.go.kr/1220000/cntyperetprgtqtyacrs/getCntyPerEtprGtqtyAcrs"
          OUT_URL = "https://apis.data.go.kr/1220000/cntyperportgtqtyacrs/getCntyPerPortGtqtyAcrs"
          PM_URL = "https://apis.data.go.kr/1192000/VsslEtrynd5/Info5"


          def safe(s):
              s = str(s)
              s = re.sub(r"(?i)(service_?key=)[^&\s'\"<>]+", r"\1***", s)
              for f in FORMS:
                  s = s.replace(f, "***")
              return s


          def say(*a):
              print(safe(" ".join(str(x) for x in a)), flush=True)


          def ws(x):
              return re.sub(r"\s+", " ", str(x or ""))


          def left():
              return BUDGET - (time.time() - T0)


          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0 (sports-industry-monitor data-source probe)"})


          def get(url, params, timeout=(8, 60)):
              t = time.time()
              try:
                  r = S.get(url, params={"serviceKey": KEY, **params}, timeout=timeout)
                  return r, None, time.time() - t
              except Exception as e:
                  return None, f"{type(e).__name__}: {str(e)[:100]}", time.time() - t


          def xml_items(text):
              root = ET.fromstring(text)
              code = (root.findtext(".//resultCode") or "").strip()
              msg = (root.findtext(".//resultMsg") or "").strip()
              total = (root.findtext(".//totalCount") or "").strip()
              its = [{c.tag: (c.text or "").strip() for c in it} for it in root.iter("item")]
              return code, msg, total, its


          def n(v):
              try:
                  return float(str(v).replace(",", ""))
              except ValueError:
                  return None


          # 0) apis.data.go.kr 연결될 때까지(최대 4분) — 선박입출항 1건으로
          ok = False
          while left() > 250:
              today = datetime.datetime.now(KST).strftime("%Y%m%d")
              r, err, sec = get(PM_URL, {"prtAgCd": "020", "sde": today, "ede": today, "numOfRows": "1", "pageNo": "1"}, timeout=(8, 30))
              if r is not None:
                  ok = True
                  say(f"연결됨 · {time.time() - T0:.0f}초 · 선박입출항 HTTP {r.status_code} · {ws(r.text)[:160]}")
                  break
              say(f"  연결 안 됨({time.time() - T0:.0f}초) {err}")
              time.sleep(10)
          if not ok:
              say("== 연결 안 됨 — 끝 ==")
              raise SystemExit(0)


          def show_kcs(label, url, params, inbound=True):
              r, err, sec = get(url, params)
              if err:
                  say(f"== {label} 실패 {err}")
                  return None
              say(f"== {label} · HTTP {r.status_code} · {len(r.content):,}B · {sec:.1f}s · {r.headers.get('content-type', '')[:40]}")
              try:
                  code, msg, total, its = xml_items(r.text)
              except Exception as e:
                  say("   XML 아님:", type(e).__name__, ws(r.text)[:400])
                  return None
              say(f"   resultCode={code} msg={msg} totalCount={total} items={len(its)}")
              if not its:
                  say("   본문:", ws(r.text)[:400])
                  return its
              say("   키:", sorted(its[0].keys()))
              say("   예:", json.dumps(its[:2], ensure_ascii=False))
              port_k, cnty_k = ("arvlPlcNm", "dptrPlcNm") if inbound else ("dptrPlcNm", "arvlPlcNm")
              mons = Counter(it.get("yyyymm") for it in its)
              say("   달:", sorted(mons.items()))
              ports = Counter(it.get(port_k) for it in its)
              say(f"   항구/공항({len(ports)}):", ports.most_common(40))
              odd = [it for it in its if re.search(r"계|합|전체|total|기타", (it.get(cnty_k) or "") + (it.get(port_k) or ""), re.I)]
              say(f"   합계·기타 같은 행 {len(odd)}:", json.dumps(odd[:6], ensure_ascii=False))
              last = max(mons)
              for pk in [p for p, _ in ports.most_common() if re.search(r"부산|인천", p or "")][:6]:
                  rows = [it for it in its if it.get(port_k) == pk and it.get("yyyymm") == last]
                  tot_teu = sum(n(it.get("teuGcnt")) or 0 for it in rows)
                  tot_w = sum(n(it.get("blWght")) or 0 for it in rows)
                  tot_bl = sum(n(it.get("blCnt")) or 0 for it in rows)
                  top = sorted(rows, key=lambda it: -(n(it.get("teuGcnt")) or 0))[:14]
                  topw = sorted(rows, key=lambda it: -(n(it.get("blWght")) or 0))[:10]
                  say(f"   [{pk} {last}] 나라 {len(rows)} · TEU {tot_teu:,.0f} · 중량 {tot_w:,.0f} · BL {tot_bl:,.0f}")
                  say("     TEU 상위:", [(it.get(cnty_k), it.get("teuGcnt"), it.get("blWght"), it.get("blCnt")) for it in top])
                  say("     중량 상위:", [(it.get(cnty_k), it.get("blWght"), it.get("blCnt")) for it in topw])
              want = ["홍콩", "네덜란드", "벨기에", "아랍에미리트", "아랍에미리트 연합", "아랍 에미리트 연합", "중국", "싱가포르", "독일", "미국",
                      "말레이시아", "이탈리아", "프랑스", "영국", "일본", "베트남", "스페인", "스위스", "대만", "태국"]
              allc = Counter(it.get(cnty_k) for it in its)
              say("   나라 이름(일부 찾기):", {w: allc.get(w) for w in want})
              say("   나라 이름 전체:", sorted(allc)[:400])
              return its


          now = datetime.datetime.now(KST)
          ym = lambda d: d.strftime("%Y%m")
          m1 = (now.replace(day=1) - datetime.timedelta(days=1))          # 지난달
          m2 = (m1.replace(day=1) - datetime.timedelta(days=1))          # 지지난달
          say("조회 달:", ym(m2), "~", ym(m1))

          # 1) 국가별 입항 — 해상 수입 · 항공 수입 · 해상 환적
          show_kcs("입항 해상 수입(I·10)", IN_URL, {"strtYymm": ym(m2), "endYymm": ym(m1), "cargTpcd": "I", "seaFlghTpcd": "10"})
          if left() > 60:
              show_kcs("입항 항공 수입(I·40)", IN_URL, {"strtYymm": ym(m1), "endYymm": ym(m1), "cargTpcd": "I", "seaFlghTpcd": "40"})
          if left() > 60:
              r, err, sec = get(IN_URL, {"strtYymm": ym(m1), "endYymm": ym(m1), "cargTpcd": "T", "seaFlghTpcd": "10"})
              say("== 입항 해상 환적(T·10)", err or f"HTTP {r.status_code} · {len(r.content):,}B · {ws(r.text)[:200]}")
          # 데이터가 어디까지 있나: 이번 달
          if left() > 60:
              r, err, sec = get(IN_URL, {"strtYymm": ym(now), "endYymm": ym(now), "cargTpcd": "I", "seaFlghTpcd": "10"})
              say("== 입항 이번 달", err or f"HTTP {r.status_code} · {len(r.content):,}B · {ws(r.text)[:300]}")
          # 오래된 달(추이용): 2년 범위 한 번에
          if left() > 90:
              r, err, sec = get(IN_URL, {"strtYymm": "202401", "endYymm": ym(m1), "cargTpcd": "I", "seaFlghTpcd": "10"})
              if err:
                  say("== 입항 2024-01~ 한 번에 실패", err)
              else:
                  try:
                      code, msg, total, its = xml_items(r.text)
                      say(f"== 입항 2024-01~{ym(m1)} 한 번에 · {len(r.content):,}B · {sec:.1f}s · code={code} total={total} items={len(its)} · 달 {len(set(it.get('yyyymm') for it in its))}개")
                  except Exception as e:
                      say("== 입항 2년 XML 아님", ws(r.text)[:300])

          # 2) 국가별 출항 — 화물 구분 코드 비교(E·R·T·없음)
          for cg in ("E", "R", "T", None):
              if left() < 50:
                  break
              p = {"strtYymm": ym(m1), "endYymm": ym(m1), "seaFlghTpcd": "10"}
              if cg:
                  p["cargTpcd"] = cg
              r, err, sec = get(OUT_URL, p)
              if err:
                  say(f"== 출항 해상 {cg} 실패 {err}")
                  continue
              try:
                  code, msg, total, its = xml_items(r.text)
              except Exception:
                  say(f"== 출항 해상 {cg} XML 아님 {ws(r.text)[:300]}")
                  continue
              bus = [it for it in its if re.search("부산", it.get("dptrPlcNm") or "")]
              teu = sum(n(it.get("teuGcnt")) or 0 for it in bus)
              say(f"== 출항 해상 cargTpcd={cg} · code={code} {msg} · total={total} · items={len(its)} · 부산 행 {len(bus)} · 부산 TEU {teu:,.0f}")
              if cg == "R" and its:
                  say("   키:", sorted(its[0].keys()), "· 예:", json.dumps(its[:2], ensure_ascii=False))
                  say("   출항지:", Counter(it.get("dptrPlcNm") for it in its).most_common(20))
                  top = sorted([it for it in its if it.get("dptrPlcNm") == "부산신항"], key=lambda it: -(n(it.get("teuGcnt")) or 0))[:12]
                  say("   부산신항 목적국 TEU 상위:", [(it.get("arvlPlcNm"), it.get("teuGcnt"), it.get("blWght")) for it in top])

          # 3) 인천공항 화물기 T1·T2 — 키 등록 확인 + 응답 모양
          for t in ("T1", "T2"):
              for op in ("Arrivals", "Departures"):
                  if left() < 20:
                      break
                  r, err, sec = get(f"https://apis.data.go.kr/B551177/statusOfCgoFltDeOdp{t}/getCgoFlt{op}DeOdp{t}",
                                    {"numOfRows": "3", "pageNo": "1", "type": "json", "searchDate": now.strftime("%Y%m%d")}, timeout=(8, 30))
                  say(f"== 화물기 {t} {op} ==", err or f"HTTP {r.status_code} · {ws(r.text)[:2500]}")
          say("== 끝 ==")
          PY
      - name: Check files against CLAUDE.md
        run: |
          python - <<'PY'
          import glob, json, os, re, sys

          errs = []
          md = open("CLAUDE.md", encoding="utf-8").read()

          def section(title):
              m = re.search(r"^## " + re.escape(title) + r"[^\n]*\n(.*?)(?=^## |\Z)", md, re.M | re.S)
              return m.group(1) if m else ""

          def rows(text):
              for line in text.splitlines():
                  if line.startswith("|") and not re.match(r"^\|\s*-", line):
                      yield [c.strip() for c in line.strip().strip("|").split("|")]

          # ① 파일 식별표: 파일명 → 3번째 줄 문구
          ident = {}
          for c in rows(section("파일 식별표")):
              m = re.search(r"`([^`]+)`", c[1]) if len(c) > 1 else None
              if c[0].endswith(".py") and m:
                  ident[c[0]] = m.group(1)
          if len(ident) < 8:
              errs.append(f"CLAUDE.md 파일 식별표에서 파이썬 파일을 {len(ident)}개만 읽음 — 표 형식 확인")

          for f, phrase in ident.items():
              if not os.path.exists(f):
                  errs.append(f"{f}: 식별표에 있으나 파일 없음")
                  continue
              lines = open(f, encoding="utf-8").read().splitlines()
              l3 = lines[2] if len(lines) > 2 else ""
              if phrase not in l3:
                  errs.append(f"{f}: 3번째 줄에 '{phrase}' 없음 — 실제: {l3.strip()[:80]}")

          pys = sorted(glob.glob("*.py"))
          for f in pys:
              if f not in ident:
                  errs.append(f"{f}: 식별표에 없는 파일 — CLAUDE.md 파일 식별표에 등록 필요")
              try:
                  compile(open(f, encoding="utf-8").read(), f, "exec")
              except SyntaxError as e:
                  errs.append(f"{f}: 문법 오류 {e.lineno}번째 줄 — {e.msg}")

          # ② 운영 구조표: 워크플로우 파일 → name
          wf = {}
          for c in rows(section("운영 구조")):
              m = re.fullmatch(r"`([^`]+\.yml)`", c[0])
              if m and len(c) > 1:
                  wf[m.group(1)] = c[1]
          if len(wf) < 6:
              errs.append(f"CLAUDE.md 운영 구조표에서 워크플로우를 {len(wf)}개만 읽음 — 표 형식 확인")

          ymls = sorted(glob.glob(".github/workflows/*.yml"))
          for path in ymls:
              f = os.path.basename(path)
              txt = open(path, encoding="utf-8").read()
              m = re.search(r"^name:\s*(.+?)\s*$", txt, re.M)
              name = m.group(1).strip("\"'") if m else None
              if f not in wf:
                  errs.append(f"{f}: 운영 구조표에 없는 워크플로우 — CLAUDE.md 등록 또는 파일 삭제")
              elif name != wf[f]:
                  errs.append(f"{f}: 첫 name '{name}' ≠ 운영 구조표 '{wf[f]}'")
              for s in re.findall(r"python3?\s+([\w./-]+\.py)", txt):
                  if not os.path.exists(s):
                      errs.append(f"{f}: 실행 대상 {s} 없음")
          for f in wf:
              if not os.path.exists(f".github/workflows/{f}"):
                  errs.append(f"{f}: 운영 구조표에 있으나 파일 없음")

          # ③ docs/*.json 파싱 (+ worldmap 최상위 키)
          jsons = sorted(glob.glob("docs/*.json"))
          for path in jsons:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{path}: JSON 파싱 실패 — {str(e)[:120]}")
                  continue
              if path.endswith("worldmap.json") and not all(k in d for k in ("viewBox", "europe")):
                  errs.append(f"{path}: 최상위 키 viewBox·europe 없음")

          if errs:
              for e in errs:
                  print(f"::error::{e}")
              print(f"검사 실패 {len(errs)}건")
              sys.exit(1)
          print(f"검사 통과: 파이썬 {len(pys)}개 · 워크플로우 {len(ymls)}개 · JSON {len(jsons)}개")
          PY
      - name: Install packages
        run: pip install -r requirements.txt pypdf pyyaml
      - name: Check workflow YAML and script imports
        run: |
          python - <<'PY'
          import glob, importlib, os, re, sys
          import yaml
          errs = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              f = os.path.basename(path)
              try:
                  d = yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: YAML 읽기 실패 — {str(e)[:160]}")
                  continue
              on = d.get("on", d.get(True)) or {}   # YAML 1.1은 on: 을 True로 읽음
              if not isinstance(d.get("jobs"), dict) or not d["jobs"]:
                  errs.append(f"{f}: jobs 없음")
              if f == "check.yml":
                  continue
              sch = on.get("schedule") if isinstance(on, dict) else None
              if not sch:
                  errs.append(f"{f}: 예약(schedule) 없음 — 자동 실행이 안 됨")
              for s in sch or []:
                  c = str((s or {}).get("cron", ""))
                  if len(c.split()) != 5 or not re.fullmatch(r"[\d*/,\- ]+", c):
                      errs.append(f"{f}: cron 형식 오류 '{c}'")
              if not isinstance(on, dict) or "workflow_dispatch" not in on:
                  errs.append(f"{f}: 수동 실행(workflow_dispatch) 없음")
          sys.path.insert(0, ".")
          for p in sorted(glob.glob("*.py")):
              m = p[:-3]
              try:
                  importlib.import_module(m)   # 모든 스크립트는 __main__ 가드 → 불러오기만, 실행 안 함
              except Exception as e:
                  errs.append(f"{p}: 불러오기 실패 — {type(e).__name__}: {str(e)[:160]}")
          if errs:
              for e in errs:
                  print(f"::error::{e}")
              sys.exit(1)
          print("검사 통과: 워크플로우 YAML·예약 형식, 스크립트 불러오기")
          PY
      - name: Build dashboard and check page script
        run: |
          python build_dashboard.py
          python - <<'PY'
          import re, sys
          h = open("docs/index.html", encoding="utf-8").read()
          i, j = h.find("<script>"), h.rfind("</script>")
          if i < 0 or j < i:
              print("::error::index.html에서 <script> 블록을 못 찾음"); sys.exit(1)
          open("/tmp/page.js", "w", encoding="utf-8").write(h[i + 8:j])
          for mark in ('id="todayCard"', 'id="statusWarn"', 'id="brandBody"', 'id="mkChips"', 'id="newsBody"', 'id="kpis"'):
              if mark not in h:
                  print(f"::error::index.html에 {mark} 없음 — 화면 뼈대 확인"); sys.exit(1)
          print(f"index.html {len(h):,}자 · 스크립트 {j - i - 8:,}자")
          PY
          node --check /tmp/page.js && echo "화면 스크립트 문법 통과"
